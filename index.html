   --------------------------------------------------------------- */
function Chamber(side){
  const st=S[side], other = side==="a"?S.b.name:S.a.name;
  Sky.setMerge(0); Sky.setEnergy(.3); Sky.setFocus(1);
  const n=stage(voiceShell({
    title: side==="a"?"Room one":"Room two", back:true, side,
    name:`${st.name}, speaking privately`, meta:`question ${Math.min(st.qCount+1,MAXQ)} of ${MAXQ}`
  }));

  const room = VoiceRoom(n,{
    next: async (onText)=>{
      if(!AI.live()) throw {code:"offline"};
      const turns=[{role:"user",content:interviewRules(st.name,other, side==="b"?(S.briefA||null):null)}, ...st.turns];
      return await streamAI(turns,onText,"default");
    },
    fallback: ()=>Local.next(side),
    onUser: t=>{ st.turns.push({role:"user",content:t}); save(); },
    onAI: (text,enough)=>{
      st.turns.push({role:"assistant",content:text}); st.qCount++; save();
      room.setMeta(`question ${Math.min(st.qCount,MAXQ)} of ${MAXQ}`);
      room.setRail(Math.round(st.qCount/MAXQ*100));
      return enough || st.qCount>=MAXQ;
    },
    onFinish: ()=>{
      st.done=true; save();
      $("#hint",n).innerHTML=`<button class="btn ${side}" id="fin">${
        S.mode==="pair" ? "Done — wait for the other room" : (side==="a"?"Seal this room":"Bring both sides together")}</button>`;
      $("#fin",n).onclick=()=>{
        if(S.mode==="pair") go("hold");
        else go(side==="a"?"seal":"doubting");
      };
    }
  });

  room.setRail(Math.round(st.qCount/MAXQ*100));
  if(st.done){ $("#cap",n).textContent="This room is closed."; $("#vstate",n).textContent="done";
    $("#mainBtn",n).style.display="none";
    $("#hint",n).innerHTML=`<button class="btn ${side}" id="fin">Continue</button>`;
    $("#fin",n).onclick=()=>{ if(S.mode==="pair") go("hold"); else go(side==="a"?"seal":"doubting"); };
  } else room.speakNext();

  wireTop(n,()=>{ if(confirm("Leave this room? Everything said here is kept.")) go(S.mode==="pair"?"pair":"setup"); });
  return n;
}

/* ---------------------------------------------------------------
   18. SYNTHESIS
   --------------------------------------------------------------- */
function Synth(){
  Sky.setEnergy(1); Sky.setFocus(0);
  const steps=["Reading both accounts in full","Separating facts from feelings","Finding the assumptions underneath","Marking where the two stories split","Writing something you can both read"];
  const n=stage(`
    <div class="synth grow">
      <div style="height:clamp(110px,24dvh,200px)"></div>
      <div class="stack sm" style="text-align:center">
        <h2 class="h2">${S.round>1?"Rewriting it":"Bringing both sides together"}</h2>
        <p class="lede" style="margin-inline:auto">${S.round>1?"Taking the objection seriously, not just moving a number.":"Neither of you is being scored."}</p>
      </div>
      <div class="synthsteps">${steps.map((s,i)=>`<div class="sstep" data-i="${i}"><span class="sdot"></span><span>${esc(s)}</span></div>`).join("")}</div>
    </div>`);
  const my=TOKEN, all=n.querySelectorAll(".sstep"); let i=-1;
  const adv=()=>{ if(i>=0)all[i].classList.replace("on","done"); i++; if(i<all.length){all[i].classList.add("on"); Sky.setMerge(.2+i*.17);} };
  adv(); const tick=setInterval(adv,2500);

  (async()=>{
    let rep;
    try{
      if(!AI.live()) throw {code:"offline"};
      rep = await AI.chat([{role:"user",content:synthesisPrompt()}],{json:true,tier:"complex"});
    }catch(e){ await wait(1200); rep = Local.report(); }
    if(TOKEN!==my) return;
    clearInterval(tick);
    all.forEach(s=>{ s.classList.remove("on"); s.classList.add("done"); });
    S.report = normalise(rep); S.a.satisfied=null; S.b.satisfied=null;
    S.a.rebuttal=""; S.b.rebuttal=""; save();
    Sky.setMerge(1);
    await wait(1400);
    if(TOKEN===my) go("findings");
  })();
  return n;
}

function normalise(r){
  const d=Local.report(); r=r||{};
  const arr=(v,f)=>Array.isArray(v)&&v.length?v:f;
  r.headline=r.headline||d.headline;
  r.commonGround=arr(r.commonGround,d.commonGround);
  r.truthMap=arr(r.truthMap,d.truthMap).map(x=>({what:x.what||"",kind:["agreed","disputed","unseen"].includes(x.kind)?x.kind:"unseen",a:x.a||"",b:x.b||""}));
  r.lenses=r.lenses||d.lenses;
  ["a","b"].forEach(k=>{ r.lenses[k]=r.lenses[k]||d.lenses[k];
    ["facts","feelings","assumptions"].forEach(f=>r.lenses[k][f]=arr(r.lenses[k][f],d.lenses[k][f])); });
  r.bridge=r.bridge||d.bridge; r.unsaid=r.unsaid||d.unsaid; r.contribution=r.contribution||d.contribution;
  let pa=Number(r.contribution.a?.pct); if(!isFinite(pa)) pa=50;
  pa=clamp(Math.round(pa),25,75); r.contribution.a.pct=pa; r.contribution.b.pct=100-pa;
  r.pact=arr(r.pact,d.pact).slice(0,4);
  r.apology=r.apology||d.apology; r.spoken=r.spoken||d.spoken; r.closing=r.closing||d.closing;
  return r;
}

/* ---------------------------------------------------------------

/* ---------------------------------------------------------------
   20. REBUTTAL — the mediator hears the objection
   --------------------------------------------------------------- */
function pendingSide(){
  if(S.a.satisfied===false && !S.a.rebuttal) return "a";
  if(S.b.satisfied===false && !S.b.rebuttal) return "b";
  return null;
}
function Rebuttal(){
  const side = pendingSide();
  if(!side) return (go("persuade"), stage(""));
  const st=S[side];
  Sky.setMerge(.6); Sky.setEnergy(.5); Sky.setFocus(1);
  const n=stage(voiceShell({title:"What's still wrong",back:false,side,name:`${st.name}, tell it straight`,meta:"round "+S.round}));
  let asked=false;
  const room=VoiceRoom(n,{
    next: async(onText)=>{
      if(asked) return "Got it. I'll take that seriously and write it again. <ENOUGH>";
      asked=true;
      const t=`I heard you say it doesn't land yet. Tell me the part that's wrong — not all of it, just the piece that made you say no.`;
      onText({text:t}); return t;
    },
    onUser: t=>{ st.rebuttal=t; save(); },
    onAI: ()=> !!st.rebuttal,
    onFinish: ()=>{
      $("#hint",n).innerHTML=`<button class="btn ${side}" id="fin">Continue</button>`;
      $("#fin",n).onclick=()=>{ const more=pendingSide(); go(more?"rebuttal":"persuade"); };
    }
  });
  room.setRail(50); room.speakNext();
  wireTop(n,null); return n;
}

/* ---------------------------------------------------------------
   21. PERSUADE — spoken directly to whoever is still holding out
   --------------------------------------------------------------- */
function Persuade(){
  const holdout = S.a.satisfied===false ? "a" : S.b.satisfied===false ? "b" : null;
  if(!holdout){ S.round++; return (go("synth"), stage("")); }
  const other = holdout==="a" ? "b" : "a";
  const both = S.a.satisfied===false && S.b.satisfied===false;
  Sky.setMerge(.7); Sky.setEnergy(.8); Sky.setFocus(1);

  const n=stage(`
    ${topbar("One more thing",false)}
    <div class="voice grow">
      <div class="voicestage"><div class="vorb"><span class="vstate live" id="vstate">speaking</span></div></div>
      <div class="caption" id="cap"></div>
      <div class="stack" style="padding-top:12px">
        <button class="btn bloom" id="again">Write it again, properly</button>
        <button class="linkish" id="skip" style="text-align:center">Accept it as it stands</button>
      </div></div>`);
  const my=TOKEN, cap=$("#cap",n);
  (async()=>{
    let text="";
    try{
      if(!AI.live()) throw {code:"offline"};
      text = await AI.chat([{role:"user",content: both
        ? `You are the mediator in "Obviously, I'm Right". BOTH ${S.a.name} and ${S.b.name} say the summary doesn't land.\n\n${VOICE_STYLE}\n\n${S.a.name} objected: "${S.a.rebuttal}"\n${S.b.name} objected: "${S.b.rebuttal}"\n\nSay something to the two of them together, out loud, under 70 words. Notice what their two objections have in common — that is usually the real conflict. Be warm and direct. No lists.`
        : persuadePrompt(S[holdout].name, S[other].name)}],
        {tier:"default", onText:({text:t})=>{ if(TOKEN===my){ cap.textContent=t; Speak.feed(t); } }});
    }catch(e){
      text = `${S[holdout].name}, you're allowed to still be angry. But holding the line here costs you something real, and it isn't the argument. Tell me the piece that's wrong and I'll write it again — properly this time, not just softer.`;
      cap.textContent=text;
    }
    if(TOKEN!==my) return;
    cap.textContent=String(text).trim();
    Speak.flush(String(text).trim(), ()=>{ const v=$("#vstate",n); if(v){ v.textContent="your call"; v.classList.remove("live"); } });
  })();
  $("#again",n).onclick=()=>{ S.round++; save(); go("synth"); };
  $("#skip",n).onclick=()=>{ S.a.satisfied=true; S.b.satisfied=true; save(); go("sealed"); };
  wireTop(n,null); return n;
}

/* ---------------------------------------------------------------
   22. SEALED
   --------------------------------------------------------------- */
function Sealed(){
  Sky.setMerge(1); Sky.setEnergy(1); Sky.setFocus(0);
  const r=S.report;
  const n=stage(`
    <div class="grow center" style="display:flex;flex-direction:column;gap:24px;text-align:center">
      <div class="orbwrap" style="height:min(26dvh,190px)"></div>
      <div class="stack"><h1 class="h2">${esc(S.a.name)} and ${esc(S.b.name)}, both agreed.</h1>
        <p class="headline" style="color:var(--mist);font-size:19px;margin-top:10px">${esc(r.closing)}</p></div>
      <div class="card bloom" style="text-align:left"><div class="stack sm">
        ${r.pact.map((p,i)=>`<div style="display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start">
          <span class="pactnum" style="font-size:15px">${i+1}</span><span style="font-size:14px;line-height:1.5">${esc(p)}</span></div>`).join("")}
      </div></div>
      <p class="tiny">Settled in ${S.round} round${S.round>1?"s":""}</p>
    </div>
    <div class="stack" style="padding-top:10px">
      <button class="btn ghost" id="saveTxt">Save the summary</button>
      <button class="btn bloom" id="again">Start a new mediation</button></div>`);
  $("#again",n).onclick=reset;
  $("#saveTxt",n).onclick=saveSummary;
  return n;
}

function summaryText(){
  const r=S.report,A=S.a.name,B=S.b.name,L=[];
  L.push("OBVIOUSLY, I'M RIGHT — mediation summary");
  L.push(`${A} and ${B} · ${S.relation} · about ${S.topic} · round ${S.round}`);
  L.push("".padEnd(52,"-"),"",r.headline,"");
  L.push("WHAT YOU AGREE ON"); r.commonGround.forEach(x=>L.push("  · "+x)); L.push("");
  L.push("WHERE YOUR STORIES SPLIT");
  r.truthMap.forEach(x=>{L.push(`  [${x.kind}] ${x.what}`);L.push(`      ${A}: ${x.a}`);L.push(`      ${B}: ${x.b}`);});
  L.push("","WHAT YOU EACH MEANT",`  ${A}: ${r.bridge.a.meant}`,`  ${B}: ${r.bridge.b.meant}`);
  L.push("","WHAT WENT UNSAID",`  ${A}: ${r.unsaid.a}`,`  ${B}: ${r.unsaid.b}`);
  L.push("","HOW EACH ADDED TO IT",`  ${A} (${r.contribution.a.pct}%): ${r.contribution.a.note}`,`  ${B} (${r.contribution.b.pct}%): ${r.contribution.b.note}`);
  L.push("","THE AGREEMENT"); r.pact.forEach((p,i)=>L.push(`  ${i+1}. ${p}`));
  L.push("","FIRST WORDS",`  ${A}: "${r.apology.a}"`,`  ${B}: "${r.apology.b}"`);
  L.push("",r.closing);
  return L.join("\n");
}
async function saveSummary(){
  const txt=summaryText();
  const name=`mediation-${S.a.name}-${S.b.name}.txt`.replace(/\s+/g,"-").toLowerCase();
  if(window.claude?.use){ try{ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename:name,data:txt}); return; } }catch(e){} }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ navigator.share?.({title:"Mediation summary",text:txt}).catch(()=>{}); }
}

    <div class="notice" id="testOut" hidden></div>
    ${deferredInstall?`<button class="btn ghost" id="install">Install on this phone</button>`:
      `<p class="notice">To install: browser menu, then "Add to Home screen".</p>`}
    <button class="btn ghost" id="hostBtn">Host settings (owner)</button>
    <button class="btn ghost" id="wipe">Clear this mediation</button>
    <button class="linkish" id="close" style="text-align:center">Close</button></div>`;
  sheet.classList.add("on");
  const close=()=>sheet.classList.remove("on");
  const provSel=$("#provIn",body), keyIn=$("#keyIn",body), keyTip=$("#provTip",body);
  const langIn=$("#langIn",body);
  langIn.value=store.get("lang", null)||store.get("accent", null)||"auto";
  langIn.onchange=()=>{
    const v=langIn.value;
    store.set("lang", v); store.del("accent");
    AI.lang=v;
    Speak.pick();
    const voiceTip=$("#voiceTip",body);
    const onHost = !!(globalThis.AI && AI.serverUrl);
    const cloudOk = /^(ml|hi)/i.test(v) && onHost;
    if(/^(ml|hi)/i.test(v) && !onHost){
      voiceTip.hidden=false;
      voiceTip.textContent="Voice replies need the hosted site. Open https://oirai.netlify.app in this browser (this local file can't reach the cloud voice).";
    } else { voiceTip.hidden=true; }
    if(Speak.enabled && (cloudOk || Speak.ready())){
      const sample = /^ml/i.test(v) ? "എനിക്ക് മലയാളത്തിൽ ചിന്തിക്കാനും പറയാനും കഴിയും."
        : /^hi/i.test(v) ? "मैं हिंदी में सोच और बोल सकती हूँ।"
        : "I can listen and reply in this language.";
      Speak.cancel(); Speak.reset(); Speak.flush(sample, ()=>{});
    }
  };
  const proxyIn=$("#proxyIn",body);
  proxyIn.value = AI.proxyBase && !AI.proxyBase.startsWith("/") ? AI.proxyBase : "";
  const keys={groq:AI.keys.groq, openai:AI.keys.openai, gemini:AI.keys.gemini};
  const provTips={
    groq:"Groq is the fastest — paste your key above.",
    openai:"GPT-6 Astra, OpenAI's flagship model — paste your key above.",
    gemini:"Gemini needs the Generative Language API enabled on its Google project."
  };
  provSel.value=AI.provider;
  provSel.dataset.prev=AI.provider;
  keyIn.value=keys[provSel.value]||"";
  keyTip.textContent=provTips[provSel.value];
  provSel.onchange=()=>{
    keys[provSel.dataset.prev]=keyIn.value.trim();
    keyIn.value=keys[provSel.value]||"";
    provSel.dataset.prev=provSel.value;
    keyTip.textContent=provTips[provSel.value];
  };
  $("#close",body).onclick=close;
  sheet.onclick=e=>{ if(e.target===sheet) close(); };
  $("#saveCfg",body).onclick=()=>{
    store.set("lang", langIn.value.trim()||"auto"); store.del("accent");
    if(!AI.hasConfig){
      const p=provSel.value, k=keyIn.value.trim(), f=$("#fbIn",body).value.trim().replace(/\/+$/,"");
      const pr=proxyIn.value.trim().replace(/\/+$/,"");
      keys[p]=k;
      store.set("provider",p);
      keys.groq?store.set("key_groq",keys.groq):store.del("key_groq");
      keys.openai?store.set("key_openai",keys.openai):store.del("key_openai");
      keys.gemini?store.set("key_gemini",keys.gemini):store.del("key_gemini");
      store.del("key");
      pr?store.set("proxy",pr):store.del("proxy");
      f?store.set("fb",f):store.del("fb");
    }
    try{ location.reload(); }catch(e){ close(); render(); }
  };
  $("#testBtn",body).onclick=async()=>{
    const out=$("#testOut",body), btn=$("#testBtn",body);
    out.hidden=false; out.className="notice"; out.textContent="Calling the mediator…";
    btn.disabled=true;
    if(!AI.hasConfig && provSel){
      const p=provSel.value, k=keyIn.value.trim();
      if(k && k!==AI.keys[p]){ AI.keys[p]=k; store.set("key_"+p,k); }
      AI.provider=p; store.set("provider",p);
    }
    await AI.init();
    const r=await AI.test();
    btn.disabled=false;
    out.className = "notice"+(r.ok?"":" warn");
    out.innerHTML = r.ok
      ? `<b style="color:var(--bloom)">Live.</b> ${esc(r.backend)} answered in ${r.ms}ms — "${esc(r.detail)}". Real replies from here on.`
      : `<b style="color:var(--ember)">Not connected.</b> ${esc(r.backend)} said: ${esc(r.detail)}<br><br>Most common causes: the API key isn't enabled on that provider's project, the key has an HTTP-referrer restriction that blocks this site, or the key was pasted with a stray space.`;
  };
  $("#hostBtn",body).onclick=()=>{ close(); go("admin"); };
  const ins=$("#install",body); if(ins) ins.onclick=()=>{ close(); deferredInstall.prompt(); deferredInstall=null; };
  $("#wipe",body).onclick=()=>{ close(); reset(); };
}

function reset(){
  TOKEN++; Speak.cancel(); Ears.stop(false); Net.stopListen();
  store.del("last");
  Object.assign(S,{stage:"open",room:null,seat:null,mode:"solo",a:blankSide(),b:blankSide(),
    relation:"",topic:"",report:null,cross:null,round:1,signed:{a:false,b:false},briefA:null});
  Sky.setMerge(0); Sky.setFocus(0);
  render();
}

/* ---------------------------------------------------------------
   24. BOOT
   --------------------------------------------------------------- */
(async function boot(){
  render();
  await AI.init();            // also fetches the host config the owner set
  await Net.init();
  const prev = store.get("last", null);
  if(prev && prev.stage && prev.stage!=="open" && prev.a?.name){
    Object.assign(S, prev);
    if(S.room && Net.available()) Net.listen();
    render();
  }
  addEventListener("beforeunload",()=>{ try{ Speak.cancel(); }catch(e){} });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ Speak.cancel(); Ears.stop(false); } });
})();
</script>
</body>
</html>
