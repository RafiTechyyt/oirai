const Local = {
  qs:[
    (m,o)=>`I'm listening, and ${o} can't hear any of this. Take your time — where does it hurt most?`,
    ()=>`I can hear how much that moment stayed with you. Go on, in your own words.`,
    (m,o)=>`There's more underneath that. What were you really hoping ${o} would understand?`,
    (m,o)=>`You wanted something from ${o} that you never got. Say what it was.`,
    ()=>`That matters. Did you ever say it out loud, or did you carry it alone?`,
    ()=>`I think I understand you now. Is there one more thing you need me to hold onto?`
  ],
  next(side){
    const st=S[side], me=st.name, o=side==="a"?S.b.name:S.a.name, i=st.qCount;
    if(i>=this.qs.length) return `That's everything I need. Thank you for being straight with me. <ENOUGH>`;
    let lead="";
    const last = st.turns.filter(t=>t.role==="user").slice(-1)[0]?.content||"";
    if(i>0 && last.length>12){
      const frag = last.split(/[.,!?;]/)[0].split(" ").slice(0,7).join(" ").toLowerCase();
      lead = `${["I hear that","That lands","Thank you for that","Okay"][i%4]}, ${frag}. `;
    }
    return lead + this.qs[i](me,o);
  },
  doubts(){ 
    const L=spokenLang();
    if(L==="Malayalam") return {
      a:[`നിങ്ങളെ ഏറ്റവും വേദനിപ്പിച്ച നിമിഷം ഏത്?`,`അവർ എന്ത് ചെയ്തു എന്നതിന് പകരം എന്താണ് നിങ്ങൾ ആഗ്രഹിച്ചത്?`],
      b:[`അതേ നിമിഷം നിങ്ങളുടെ ഭാഗത്തു നിന്ന് പറഞ്ഞു നോക്കൂ.`,`അവർക്ക് അറിയാമെന്ന് നിങ്ങൾ കരുതി പറയാതെ വിട്ടത് എന്ത്?`]
    };
    if(L==="Hindi") return {
      a:[`वो कौन सा लम्हा था जिसने सबसे ज़्यादा चोट पहुँचाई?`,`आप वास्तव में चाहते थे कि वो क्या करे?`],
      b:[`उसी लम्हे को अपनी तरफ़ से सुनाइए।`,`कुछ ऐसा जो आपने मान लिया पर कभी कहा नहीं?`]
    };
    return {
      a:[`Which moment hurt most?`,`What did you actually want them to do instead?`],
      b:[`Take me through that same moment from your side.`,`Was there something you assumed was obvious but never said out loud?`]
    };
  },
  longest(side,n=1){
    return S[side].turns.filter(t=>t.role==="user").map(t=>t.content.trim())
      .sort((a,b)=>b.length-a.length).slice(0,n)
      .map(s=>s.length>90?s.slice(0,88).trim()+"…":s);
  },
  report(){
    const A=S.a.name,B=S.b.name,T=S.topic||"this";
    const la=this.longest("a",2), lb=this.longest("b",2);
    const wa=words(S.a.turns.filter(t=>t.role==="user").map(t=>t.content).join(" "));
    const wb=words(S.b.turns.filter(t=>t.role==="user").map(t=>t.content).join(" "));
    const pa=clamp(Math.round(50+(wa-wb)/Math.max(wa+wb,1)*18),30,70);
    return {
      headline:`This stopped being about ${T} a while ago. It's about whether each of you still feels held in mind by the other.`,
      commonGround:["Neither of you wants this to keep going","You both still care what the other thinks","You both felt unheard before you felt angry","Neither of you set out to hurt the other"],
      truthMap:[
        {what:"What was actually said",kind:"disputed",a:la[0]||`${A} remembers it one way`,b:lb[0]||`${B} remembers it differently`},
        {what:"That it escalated fast",kind:"agreed",a:"Agrees it got big quickly",b:"Agrees it got big quickly"},
        {what:"What the other person intended",kind:"disputed",a:la[1]||`${A} read it as deliberate`,b:lb[1]||`${B} says that was never the intent`},
        {what:"That neither said the real thing out loud",kind:"unseen",a:`${A} waited to be asked`,b:`${B} waited to be asked`}
      ],
      lenses:{
        a:{facts:["Something specific happened","There was a gap before it was addressed"],feelings:["Dismissed","More hurt than angry"],assumptions:[`You assumed ${B} knew exactly what they were doing`,"You assumed silence meant they didn't care"]},
        b:{facts:["The same event happened","It was handled differently than expected"],feelings:["Cornered","Tired of being read wrong"],assumptions:[`You assumed ${A} was keeping score`,"You assumed explaining would sound like an excuse"]}
      },
      bridge:{a:{said:la[0]||`What ${A} said in the moment`,meant:`Underneath it: ${A} wanted to matter enough that you'd notice without being told.`},
              b:{said:lb[0]||`What ${B} said in the moment`,meant:`Underneath it: ${B} was protecting themselves from being made the villain again.`}},
      unsaid:{a:`${A} never said plainly: "I needed you to come to me first."`,b:`${B} never said plainly: "I didn't know it mattered that much to you."`},
      contribution:{a:{pct:pa,note:`${A}, you decided what it meant before you asked. That turned a question into a verdict.`},
                    b:{pct:100-pa,note:`${B}, you went quiet to avoid a fight. The silence said more than you intended.`}},
      pact:["When something stings, say it within 24 hours, not perfectly, just out loud","Ask what the other meant before deciding what it meant","Neither of you brings this argument up again as ammunition"],
      apology:{a:`${B}, I decided what you meant instead of asking. That wasn't fair to you.`,b:`${A}, I went quiet when you needed me to stay. I'm sorry that felt like not caring.`},
      spoken:`Here's what I think is actually going on. You're both defending the same thing from opposite ends. ${A} needed to be come to. ${B} needed room to not be the villain. Neither of you asked for it out loud, so you both read silence as proof. Say the thing you've been waiting to be asked about. That's the whole fix.`,
      closing:"You're not arguing because you stopped caring. You're arguing because you both still do."
    };
  }
};

let TOKEN = 0;                                  // invalidates in-flight work on stage change
function go(stage){ TOKEN++; Speak.cancel(); Ears.stop(false); S.stage=stage; save(); render(); }
function el(h){ const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; }
function stage(h){ const s=document.createElement("section"); s.innerHTML=h; return s; }

let curStage=null; const LIVE={"chamberA":1,"chamberB":1,"mediate":1};
function syncRender(){                       // remote-sync path: never yank someone out of a live room
  if(S.stage===curStage && LIVE[S.stage]) return;   // same live screen — don't tear it down mid-speech
  if(S.stage!==curStage && LIVE[curStage]) return;  // other device moved on, but this one is mid-conversation
  render();
}
function render(){
  curStage=S.stage;
  const map = {
    open:Open, setup:Setup, pair:Pair, hold:Hold,
    chamberA:()=>Chamber("a"), chamberB:()=>Chamber("b"), seal:Seal,
    doubting:Doubting, doubtsA:()=>Doubts("a"), doubtsB:()=>Doubts("b"), sealD:SealD, hold2:Hold2,
    synth:Synth, convince:Convince, flip:Flip, rebuttal:Rebuttal, persuade:Persuade, sealed:Sealed,
    mediate:Mediate, medEnd:MediateEnd, medCare:MedCare,
    admin:Admin
  };
  app.innerHTML="";
  const n = (map[S.stage]||Open)();
  n.classList.add("stage","on");
  app.appendChild(n);
}
Net.onChange(()=>{ if(document.visibilityState!=="hidden") syncRender(); });

  const show=(m,w)=>{ const e=$id("admMsg"); e.hidden=false; e.className="notice"+(w?" warn":""); e.innerHTML=m; };
  const status=(m,w)=>{ const e=$id("admStatus"); e.hidden=false; e.className="notice"+(w?" warn":""); e.innerHTML=m; };
  const loginMsg=(m,w)=>{ const e=$id("admLoginMsg"); e.hidden=false; e.className="notice"+(w?" warn":""); e.innerHTML=m; };
  async function checkAuth(){
    try{
      const r=await fetch(cfgUrl+"?auth=1", {headers:authHeaders()});
      const j=await r.json().catch(()=>null);
      const on=!!(j&&j.authed);
      $id("admLogin").hidden=on; $id("admForm").hidden=!on;
      if(on) load();
      return on;
    }catch(e){
      loginMsg("Couldn't reach the config endpoint — open the app on the Netlify-hosted site.", true);
      return false;
    }
  }
  async function load(){
    try{
      const r=await fetch(cfgUrl);
      if(!r.ok) return show("Couldn't reach the config endpoint (HTTP "+r.status+"). Open the app on the Netlify-hosted site, not the local file.", true);
      const j=await r.json().catch(()=>null);
      if(!j) return show("Config endpoint returned something unexpected.", true);
      $id("admProv").value=j.provider||"groq";
      $id("admLang").value=(j.accent && j.accent!=="auto")?j.accent:"auto";
      $id("admFb").value=(j.firebaseUrl||"").replace(/\/+$/,"");
      const k=j.hasKeys||{};
      $id("admKeyGroq").placeholder    = k.groq   ? "gsk_ — already set"     : "gsk_…";
      $id("admKeyOpenai").placeholder  = k.openai ? "sk-proj- — already set" : "sk-proj-…";
      $id("admKeyGemini").placeholder  = k.gemini ? "AIza — already set"     : "AIza…";
      show(j.adminSet
        ? "This config is live and applies to everyone."
        : "No saved config yet — set the defaults and save once.");
    }catch(e){
      show("Couldn't load config: "+e.message, true);
    }
  }
  const bodyForm=()=>{
    const b={
      provider:$id("admProv").value,
      accent:$id("admLang").value,
      firebaseUrl:$id("admFb").value.trim().replace(/\/+$/,"")
    };
    const keys={}, clear={};
    const g=$id("admKeyGroq").value.trim(), o=$id("admKeyOpenai").value.trim(), m=$id("admKeyGemini").value.trim();
    if(g) keys.groq=g; if(o) keys.openai=o; if(m) keys.gemini=m;
    if($id("clrGroq").checked) clear.groq=true;
    if($id("clrOpenai").checked) clear.openai=true;
    if($id("clrGemini").checked) clear.gemini=true;
    if(Object.keys(keys).length) b.keys=keys;
    if(Object.keys(clear).length) b.clear=clear;
    return b;
  };
  wireTop(n,()=>go("open"));
  $id("admLoginBtn").onclick=async()=>{
    const pass=$id("admPass").value.trim();
    if(!pass) return loginMsg("Type the host password first.", true);
    $id("admLoginBtn").disabled=true; $id("admLoginMsg").hidden=true;
    try{
      const r=await fetch(cfgUrl+"?login=1",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pass})});
      const j=await r.json().catch(()=>null);
      $id("admLoginBtn").disabled=false;
      if(r.status===401){ loginMsg(esc((j&&j.message)||"Wrong host password."), true); return; }
      if(!r.ok){ loginMsg("Sign-in failed — HTTP "+r.status+".", true); return; }
      sessionStorage.setItem("admTok", pass);
      $id("admPass").value="";
      await checkAuth();
      loginMsg("Signed in.", false);
    }catch(e){ $id("admLoginBtn").disabled=false; loginMsg("Couldn't reach the server: "+esc(e.message), true); }
  };
  $id("admPass").addEventListener("keydown",e=>{ if(e.key==="Enter") $id("admLoginBtn").click(); });
  $id("admLogout").onclick=async()=>{
    try{ await fetch(cfgUrl+"?logout=1",{method:"POST",headers:authHeaders()}); }catch(e){}
    sessionStorage.removeItem("admTok");
    $id("admForm").hidden=true; $id("admLogin").hidden=false;
  };
  $id("admSave").onclick=async()=>{
    const btn=$id("admSave"); btn.disabled=true; status("Saving…");
    try{
      const r=await fetch(cfgUrl,{method:"POST",headers:{"Content-Type":"application/json","x-admin-token":tok()},body:JSON.stringify(bodyForm())});
      if(r.status===401){
        status("Session expired or closed — log in again.", true);
        sessionStorage.removeItem("admTok");
        $id("admForm").hidden=true; $id("admLogin").hidden=false;
      }else if(r.ok){
        const j=await r.json().catch(()=>null);
        status(j && j.ok ? "Saved. Visitors pick this up on their next visit." : "Saved, but no confirmation came back.");
        await load(); await AI.fetchConfig();
      }else{
        status("Save failed — HTTP "+r.status+".", true);
      }
    }catch(e){
      status("Couldn't reach the server: "+e.message, true);
    }
    btn.disabled=false;
  };
  $id("admReload").onclick=async()=>{ await load(); status("Reloaded."); };
  checkAuth();
  return n;
}

/* Runs one full conversational exchange loop inside a stage node. */
function VoiceRoom(n, cfg){
  const my = TOKEN;
  const cap=$("#cap",n), ucap=$("#ucap",n), vstate=$("#vstate",n);
  const mainBtn=$("#mainBtn",n), kbd=$("#kbd",n), vol=$("#volBtn",n);
  const comp=$("#composer",n), ta=$("#say",n), send=$("#send",n), hint=$("#hint",n);
  let typing = !Ears.supported();
  let busy=false, barging=false, flow=0;

  const alive = ()=>TOKEN===my;
  function setState(txt,live){ if(!alive())return; vstate.textContent=txt; vstate.classList.toggle("live",!!live); }

  vol.onclick=()=>{
    Speak.enabled=!Speak.enabled;
    vol.setAttribute("aria-pressed",String(Speak.enabled));
    vol.setAttribute("aria-label",Speak.enabled?"Mediator voice on":"Mediator voice muted");
    vol.innerHTML=(Speak.enabled?ICON.vol:ICON.mute)+'<span class="vacc">'+(Speak.enabled?"Voice on":"Muted")+'</span>';
    refreshHint();
  };
  kbd.onclick=()=>{ typing=!typing; applyMode(); };
  $("#endBtn",n).onclick=endMediation;
  function refreshHint(){
    hint.textContent = typing ? "" : (Ears.supported()
      ? (Speak.enabled ? "It listens while you talk, and answers when you pause."
         : "Voice muted — say what you need, and read the mediator's reply on screen.")
      : "Voice input isn't available in this browser — type instead.");
  }
  function applyMode(){
    comp.hidden=!typing;
    mainBtn.style.display = typing?"none":"grid";
    kbd.setAttribute("aria-pressed",String(typing));
    kbd.setAttribute("aria-label",typing?"Talk instead":"Type instead");
    refreshHint();
    if(typing) setTimeout(()=>ta.focus(),100);
  }
  const fit=()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; send.disabled=!ta.value.trim(); };
  ta.addEventListener("input",fit);
  ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&innerWidth>700){e.preventDefault();submitText();} });
  send.onclick=submitText;
  let queued="";
  function submitText(){
    const v=ta.value.trim(); if(!v) return; ta.value=""; fit();
    if(busy){ queued += (queued?"\n":"")+v; hint.textContent="Waiting for the mediator to finish — your note is queued."; return; }
    commit(v);
  }

  mainBtn.onclick=()=>{
    if(Ears.listening){ Ears.stop(true); return; }
    if(busy || Speak.busy){ Speak.cancel(); barging=true; startListening(); return; }   // barge in
    startListening();
  };

  function startListening(){
    if(!alive()||Ears.listening||document.hidden) return;
    ucap.textContent=""; ucap.style.opacity=1; setState("listening",true);
    mainBtn.dataset.live="1"; mainBtn.innerHTML=ICON.wave;
    const ok = Ears.start({
      partial:t=>{ if(alive()) ucap.textContent=t; },
      final:t=>{ if(alive()) commit(t); },
      pauseMs:2200,
      onHeld:()=>{ if(alive()) idle(); }
    });
    if(!ok){ typing=true; applyMode(); }
  }
  function idle(){
    mainBtn.dataset.live="0"; mainBtn.innerHTML=ICON.mic;
    setState(typing?"your turn":"tap to talk",false);
  }

  async function commit(text){
    if(!alive()) return;
    Ears.stop(false, true); barging=false;
    cfg.onUser(text);
    await speakNext();
  }

  function fadeUcap(){
    if(!ucap.textContent.trim()) return;
    ucap.style.opacity=0.5;
    setTimeout(()=>{ if(!alive()) return; ucap.textContent=""; ucap.style.opacity=1; }, 460);
  }

  async function speakNext(){
    if(!alive()) return;
    const my = ++flow; busy=true; barging=false;
    mainBtn.dataset.live="0"; mainBtn.innerHTML=ICON.stop;
    setState("thinking",false); cap.textContent=""; Sky.setLevel(.12);
    Speak.reset();
    let full="", started=false;
    const stream = ({text})=>{
      if(!alive()||my!==flow||barging) return;
      if(!started){ started=true; setState(Speak.enabled?"speaking":"replying",true); fadeUcap(); }
      cap.textContent = text.replace("<ENOUGH>","").trim();
      Speak.feed(text.replace("<ENOUGH>",""));
    };
    try{
      full = await cfg.next(stream);
    }catch(e){
      if(!cfg.fallback) throw e;
      if(!alive()||my!==flow) return;
      full = cfg.fallback();
      cap.textContent = full.replace("<ENOUGH>","");
      const h=$("#hint",n);
      if(h) h.innerHTML = `<span style="color:var(--ember)">Running the offline mediator — ${
        esc(AI.lastError?.message || AI.lastError?.code || "the live mediator didn't answer")
      }. Tap the gear to fix it.</span>`;
    }
    if(!alive()||my!==flow) return;
    const clean = String(full).replace("<ENOUGH>","").trim();
    fadeUcap();
    cap.textContent = clean;
    const finished = cfg.onAI(clean, /<ENOUGH>/.test(full));
    await new Promise(res=>{
      let settled=false; const done=()=>{ if(!settled){ settled=true; res(); } };
      Speak.flush(clean, done);
      if(!Speak.enabled || !Speak.ready()) setTimeout(done, Math.min(clean.length*26, 5200));
      else setTimeout(done, Math.min(clean.length*95, 32000));   // safety net
    });
    if(!alive()) return;
    if(my!==flow){ busy=false; Sky.setLevel(0); idle(); return; }   // a barge-in took over
    busy=false; Sky.setLevel(0);
    if(finished && cfg.addMore){                       // one last thing before sealing
      setState("anything else?",false);
      mainBtn.dataset.live="0"; mainBtn.innerHTML=ICON.mic; mainBtn.style.display="grid";
      kbd.style.display="grid"; comp.hidden=!typing;
      const h=$("#hint",n);
      h.innerHTML=`<div class="stack sm" style="max-width:440px;margin-inline:auto">
          <p class="tiny" style="text-align:center;color:var(--chalk)">Anything else before you seal this room? Say it — then seal.</p>
          <div class="btnrow"><button class="btn ghost sm" id="sealX">Seal it — I'm done</button></div></div>`;
      const seal=()=>{ setState("done",false); mainBtn.style.display="none"; kbd.style.display="none"; comp.hidden=true; cfg.onFinish(); };
      $("#sealX",n).onclick=seal;
      commit=async (txt)=>{
        if(!alive()) return; Ears.stop(false,true);
        cfg.onUser(txt);
        let ack="";
        try{
          if(!AI.live()) throw {code:"offline"};
          Sky.setLevel(.12); setState(Speak.enabled?"speaking":"replying",true); cap.textContent="";
          ack = await cfg.addMore(txt, t=>{ if(alive()){ cap.textContent=String(t).replace(/<ENOUGH>/g,"").trim(); Speak.feed(String(t).replace(/<ENOUGH>/g,"")); } });
        }catch(e){ ack = "That's noted. Thank you."; }
        if(!alive()) return;
        const cleanAck=String(ack).replace(/<ENOUGH>/g,"").trim();
        cap.textContent=cleanAck;
        await new Promise(res=>{ let settled=false; const done=()=>{ if(!settled){ settled=true; res(); } };
          Speak.flush(cleanAck, done);
          if(!Speak.enabled || !Speak.ready()) setTimeout(done, Math.min(cleanAck.length*26, 5200));
          else setTimeout(done, Math.min(cleanAck.length*95, 32000)); });
        if(!alive()) return;
        seal();
      };
      if(queued){ const q=queued; queued=""; setTimeout(()=>commit(q),330); }
      return;
    }
    if(finished){ setState("done",false); mainBtn.style.display="none"; kbd.style.display="none"; comp.hidden=true; cfg.onFinish(); return; }
    idle();
    if(queued){ const q=queued; queued=""; hint.textContent=""; setTimeout(()=>commit(q),350); return; }
    if(!typing && Ears.supported()) startListening();
  }

  applyMode(); idle();
  return {speakNext, setMeta:(t)=>{ $("#meta",n).textContent=t; }, setRail:p=>{ $("#rail",n).style.width=p+"%"; }};
}

async function streamAI(turns, onText, tier){ return await AI.chat(turns,{onText,tier}); }

function Setup(){
  Sky.setMerge(0); Sky.setEnergy(.55);
  const n=stage(`
    ${topbar("Who's in this?",true)}
    <div class="grow stack lg">
      <div><h2 class="h2">Two names, and what it's about.</h2>
        <p class="lede" style="margin-top:9px">You'll each speak to the mediator on your own. Neither of you hears the other's room.</p></div>
      <div class="stack">
        <label class="field a"><span>First person</span><input class="input" id="nameA" placeholder="Their name" maxlength="22" autocomplete="off"></label>
        <label class="field b"><span>Second person</span><input class="input" id="nameB" placeholder="Their name" maxlength="22" autocomplete="off"></label>
      </div>
      <div class="field"><span>How do you know each other?</span>
        <div class="chips" id="rels">${RELATIONS.map(r=>`<button class="chip" aria-pressed="false" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>
      <label class="field"><span>In one line, what's the argument about?</span>

      <div class="field"><span>How are you doing this?</span>
        <div class="chips" id="modes">
          <button class="chip" data-m="solo" aria-pressed="true">One phone, passed over</button>

        </div>
        <p class="tiny" id="pairNote"></p></div>
    </div>
    <div class="stack" style="padding-top:16px"><button class="btn" id="next" disabled>Continue</button></div>`);

  const A=$("#nameA",n),B=$("#nameB",n),T=$("#topic",n),NX=$("#next",n);
  A.value=S.a.name; B.value=S.b.name; T.value=S.topic;
  const check=()=>NX.disabled=!(A.value.trim()&&B.value.trim()&&S.relation);
  [A,B,T].forEach(i=>i.addEventListener("input",check));
  $("#rels",n).querySelectorAll(".chip").forEach(c=>{
    if(c.dataset.r===S.relation) c.setAttribute("aria-pressed","true");
    c.onclick=()=>{ $("#rels",n).querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
      c.setAttribute("aria-pressed","true"); S.relation=c.dataset.r; check(); };
  });
  const note=$("#pairNote",n), autoCode = (new URLSearchParams(location.search).get("room")||"").trim().toUpperCase();
  Net.init().then(()=>{
    if(!Net.available()){ $("#pairChip",n).disabled=true; $("#pairChip",n).style.opacity=".4";
      note.textContent="Two devices needs sync — add a Firebase URL in settings to turn it on."; }
    else{
      note.textContent = Net.label()+" is live. You'll get a 4-letter room code to share.";
      if(autoCode && !S.seat){ $("#joinIn",n).value=autoCode; doJoin(); }
    }
  });
  $("#modes",n).querySelectorAll(".chip").forEach(c=>{
    if(c.dataset.m===S.mode) c.setAttribute("aria-pressed","true");
    c.onclick=()=>{ if(c.disabled) return;
      $("#modes",n).querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
      c.setAttribute("aria-pressed","true"); S.mode=c.dataset.m; };
  });
  NX.onclick=()=>{
    S.a.name=A.value.trim(); S.b.name=B.value.trim(); S.topic=T.value.trim()||"something that happened";
    if(S.mode==="pair") go("pair"); else { S.seat=null; go("chamberA"); }
  };
  wireTop(n,()=>go("open"));
  return n;
}

   13. PAIR — room codes
   --------------------------------------------------------------- */
function Pair(){
  Sky.setMerge(.1); Sky.setEnergy(.6);
  const n=stage(`
    ${topbar("Two devices",true)}
    <div class="grow stack lg" style="padding-top:6px">
      <div><h2 class="h2">One of you opens the room.</h2>
        <p class="lede" style="margin-top:9px">The other joins with the code. You can both talk to the mediator at the same time.</p></div>
      <div class="card"><div class="stack">
        <div class="side-label a"><span class="dot a"></span>${esc(S.a.name)} — open it</div>
        <button class="btn a" id="createBtn">Create the room</button>
        <div id="codeBox" hidden><div class="code" id="codeTxt"></div>
          <p class="tiny" style="text-align:center;margin-top:8px">Give this to ${esc(S.b.name)}</p>
          <button class="btn ghost sm" id="shareBtn" style="width:100%;margin-top:12px">Share the code + link</button>
          <div id="linkWrap" hidden style="margin-top:13px" class="stack sm">
            <p class="tiny" style="text-align:center">Or send the link — it opens this same room</p>
            <input class="input mono" id="linkTxt" readonly value="" style="font-size:12.5px">
            <button class="btn ghost sm" id="copyLink" style="width:100%">Copy the link</button></div>
          <button class="btn bloom" id="goA" style="margin-top:10px">Open my room</button></div>
      </div></div>
      <div class="card"><div class="stack">
        <div class="side-label b"><span class="dot b"></span>${esc(S.b.name)} — join</div>
        <input class="codein" id="joinIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
        <button class="btn b" id="joinBtn">Join the room</button>
        <p class="tiny" id="joinMsg" style="text-align:center"></p>
      </div></div>
    </div>`);

  $("#createBtn",n).onclick=async()=>{
    const c = await Net.create();
    $("#codeTxt",n).textContent=c; $("#codeBox",n).hidden=false; $("#createBtn",n).style.display="none";
    const root = (location.origin && location.origin!=="null") ? location.origin+location.pathname : "";
    const link = root ? (root+(root.includes("?")?"&":"?")+"room="+c) : "";
    if(link){ $("#linkTxt",n).value=link; $("#linkWrap",n).hidden=false; }
    save();
  };
  $("#goA",n).onclick=()=>go("chamberA");
  $("#copyLink",n).onclick=async()=>{
    const v=$("#linkTxt",n).value;
    try{ await navigator.clipboard.writeText(v); }
    catch(e){ $("#linkTxt",n).select(); try{ document.execCommand("copy"); }catch(e2){} }
    $("#copyLink",n).textContent="Copied";
  };
  $("#shareBtn",n).onclick=()=>{
    const t=`Join our mediation. Code: ${S.room}\n${location.origin+location.pathname}?room=${S.room}`;
    if(navigator.share) navigator.share({title:"Obviously, I'm Right",text:t}).catch(()=>{});
    else { navigator.clipboard?.writeText(t); $("#shareBtn",n).textContent="Copied"; }
  };
  const doJoin=async ()=>{
    const c=$("#joinIn",n).value.trim().toUpperCase();
    if(c.length<4){ $("#joinMsg",n).textContent="That code is four letters."; return; }
    $("#joinMsg",n).textContent="Looking for the room…";
    const ok = await Net.join(c);
    if(!ok){ $("#joinMsg",n).textContent="No room with that code. Check it with them."; return; }
    if(location.search) history.replaceState(null,"",location.pathname);
    go("chamberB");
  };
  $("#joinBtn",n).onclick=doJoin;
  wireTop(n,()=>go("setup"));
  return n;
}

/* ---------------------------------------------------------------
   14. CHAMBER — the private voice interview
   --------------------------------------------------------------- */
function Chamber(side){
  const st=S[side];
  Sky.setMerge(0); Sky.setEnergy(.3); Sky.setFocus(1);
  const n=stage(voiceShell({
    title: side==="a"?"Room one":"Room two", back:true, side,
    name:`${st.name}, telling it privately`, meta:"one telling"
  }));
  const cap=$("#cap",n), ucap=$("#ucap",n), vst=$("#vstate",n);
  const mainBtn=$("#mainBtn",n), kbd=$("#kbd",n), vol=$("#volBtn",n);
  const comp=$("#composer",n), ta=$("#say",n), send=$("#send",n), hint=$("#hint",n);
  const my=TOKEN, alive=()=>TOKEN===my;
  const L=spokenLang();
  const fallbackIntro = (lang, topic)=>{
    if(lang==="Malayalam") return `ഇത് നിങ്ങൾക്കും എനിക്കും ഇടയിൽ മാത്രം. ${topic?`"${topic}" എന്ന കാര്യത്തിനുള്ളിൽ`:"ഈ കാര്യത്തിനുള്ളിൽ"} — ഏറ്റവും കൂടുതൽ വേദനിപ്പിച്ചത് എന്താണ്?`;
    if(lang==="Hindi") return `यह सिर्फ़ आप और मेरे बीच है। ${topic?`"${topic}" मामले में`:"इस मामले में"} — सबसे ज़्यादा चोट कहाँ लगी?`;
    return `This stays between us. ${topic?`About "${topic}" — `:"About what happened — "}where did it hurt the most?`;
  };
  const ack = L==="Malayalam" ? "കിട്ടി. നന്ദി. ഇത് എനിക്കൊപ്പം സൂക്ഷിക്കും."
    : L==="Hindi" ? "मिल गया। शुक्रिया। यह मेरे पास रहेगा।"
    : "I've got it, thank you. It stays with me.";
  let typing=!Ears.supported(), done=false, said="", introDone=false;

  function setState(t,v){ if(!alive())return; vst.textContent=t; vst.classList.toggle("live",!!v); }
  function applyMode(){
    comp.hidden=!typing; mainBtn.style.display=typing?"none":"grid";
    kbd.setAttribute("aria-pressed",String(typing));
    kbd.setAttribute("aria-label",typing?"Talk instead":"Type instead");
    if(typing) setTimeout(()=>ta.focus(),100);
  }
  const fit=()=>{ ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,140)+"px"; send.disabled=!ta.value.trim(); };
  ta.addEventListener("input",fit);
  ta.addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey&&innerWidth>700){ e.preventDefault(); seal(); } });
  send.onclick=seal; kbd.onclick=()=>{ typing=!typing; applyMode(); };
  $("#endBtn",n).onclick=endMediation;
  vol.onclick=()=>{
    Speak.enabled=!Speak.enabled;
    vol.setAttribute("aria-pressed",String(Speak.enabled));
    vol.innerHTML=(Speak.enabled?ICON.vol:ICON.mute)+'<span class="vacc">'+(Speak.enabled?"Voice on":"Muted")+'</span>';
  };

  function finish(){
    st.done=true; save();
    hint.innerHTML=`<button class="btn ${side}" id="fin">${
      S.mode==="pair" ? "Done — wait for the other room"
      : side==="a" ? "Seal this room"
      : "Bring both sides together"}</button>`;
    $("#fin",n).onclick=()=>{
      if(S.mode==="pair") go("hold");
      else go(side==="a"?"seal":"mediate");
    };
    setState("done",false); mainBtn.style.display="none"; kbd.style.display="none"; comp.hidden=true;
  }
  function seal(){
    if(done) return;
    const v=(said||ta.value).trim(); if(!v){ hint.textContent="Say it first — even one line is enough."; return; }
    Ears.stop(false,true); done=true;
    st.turns=[{role:"user",content:v}]; st.qCount=1; st.answers=[]; st.crossDone=true; save();
    ucap.textContent=v; ucap.style.opacity=1;
    cap.textContent=ack; setState("speaking",true);
    try{ Speak.cancel(); Speak.feed(ack); Speak.flush(ack,()=>{ if(alive()) finish(); }); }catch(e){ finish(); }
    setTimeout(()=>{ if(alive()&&!st.done) finish(); }, 12000);
  }
  function startListening(){
    if(done||!alive()||Ears.listening||document.hidden) return;
    ucap.textContent=""; setState("listening",true); mainBtn.dataset.live="1"; mainBtn.innerHTML=ICON.wave;
    const ok=Ears.start({
      partial:t=>{ if(alive()){ said=t; ucap.textContent=t; } },
      final:t=>{ if(alive()){ said=t; ucap.textContent=t; seal(); } },
      pauseMs:1600,
      onHeld:()=>{ if(alive()&&!done){ mainBtn.dataset.live="0"; mainBtn.innerHTML=ICON.mic; setState("tap to talk",false); } }
    });
    if(!ok){ mainBtn.dataset.live="0"; mainBtn.innerHTML=ICON.mic; typing=true; applyMode();
      hint.textContent="Type your side and press send — it stays private."; }
  }
  mainBtn.onclick=()=>{ if(done) return; if(Ears.listening){ Ears.stop(true); return; } startListening(); };

  wireTop(n,()=>{ if(confirm("Leave this room? What you said is kept.")) go(S.mode==="pair"?"pair":"setup"); });

  if(st.done){ cap.textContent="This room is closed."; setState("done",false);
    mainBtn.style.display="none"; kbd.style.display="none"; comp.hidden=true;
    hint.innerHTML=`<button class="btn ${side}" id="fin">Continue</button>`;
    $("#fin",n).onclick=()=>{ if(S.mode==="pair") go("hold"); else go(side==="a"?"seal":"mediate"); };
    return n;
  }

  applyMode();
  hint.textContent = typing ? "Type your side and press send — it stays private." : "Tap the mic and say it — nobody else hears it.";
  setState("reading",false); cap.textContent="";
  (async()=>{
    if(introDone) return;
    let q=fallbackIntro(L, S.topic||"");
    try{
      if(!AI.live()) throw 0;
      const t=String(await AI.chat([{role:"user",content:chamberIntroPrompt(side)}],{tier:"quick"}))
        .trim().replace(/<ENOUGH>/g,"").replace(/^["'“]+|["'”]+$/g,"").trim();
      if(t.length<6 || t.length>130) throw 0;
      if(L!=="English" && scriptPurity(L,t)<0.8) throw 0;
      q=t;
    }catch(e){}
    if(!alive()||done) return;
    introDone=true;
    cap.textContent=q; setState("speaking",true);
    try{ Speak.cancel(); Speak.feed(q); Speak.flush(q,()=>{ if(alive()&&!done&&!typing&&Ears.supported()) startListening(); }); }
    catch(e){ if(alive()&&!done) startListening(); }
  })();
  setTimeout(()=>{ if(alive()&&!done&&!introDone&&!typing&&!Speak.busy&&Ears.supported()&&!Ears.listening) startListening(); }, 28000);
  return n;
}

/* ---------------------------------------------------------------
   16. DOUBTING — the mediator works out what it still doesn't know
   --------------------------------------------------------------- */
function Doubting(){
  Sky.setMerge(.55); Sky.setEnergy(1); Sky.setFocus(0);
  const n=stage(`
    <div class="synth grow">
      <div style="height:clamp(110px,24dvh,200px)"></div>
      <div class="stack sm" style="text-align:center">
        <h2 class="h2">Reading both rooms</h2>
        <p class="lede" style="margin-inline:auto">Before it writes anything, the mediator is working out what it still doesn't understand.</p>
      </div>
      <div class="synthsteps" id="steps">
        ${["Comparing the two accounts","Finding where they don't line up","Writing its questions for each of you"]
          .map((s,i)=>`<div class="sstep" data-i="${i}"><span class="sdot"></span><span>${esc(s)}</span></div>`).join("")}
      </div></div>`);
  const my=TOKEN;
  const all=n.querySelectorAll(".sstep"); let i=-1;
  const tick=setInterval(()=>{ if(i>=0)all[i].classList.replace("on","done"); i++; if(i<all.length)all[i].classList.add("on"); },1400);
  all[0].classList.add("on");

  (async()=>{
    let cross=null;
    try{
      if(!AI.live()) throw {code:"offline"};
      cross = await AI.chat([{role:"user",content:doubtsPrompt()}],{json:true,tier:"default"});
    }catch(e){ cross = Local.doubts(); }
    if(TOKEN!==my) return;
    const fix = v => Array.isArray(v)&&v.length ? v.slice(0,2).map(String) : null;
    const inLang = spokenLang();
    const rewrite = async qs=>{
      if(inLang==="English" || !qs || !qs.length) return qs;
      const bad = qs.filter(q=>!INDIC(q));
      if(!bad.length) return qs;
      try{
        if(!AI.live()) throw {code:"offline"};
        const line = await AI.chat([{role:"user",content:
          `The mediation is happening in ${inLang}. These mediator questions must be in ${inLang} too. Translate exactly, keeping the meaning:\n${qs.map((q,i)=>(i+1)+". "+q).join("\n")}\n\nReply with only the ${inLang} questions, one per line. Nothing else.`}],{tier:"default"});
        const out = String(line).split(/\n+/).map(s=>s.replace(/^\s*[-*\d.)]*\s*/,"").trim()).filter(Boolean).slice(0,qs.length);
        if(out.length===qs.length && out.every(q=>INDIC(q))) return out;
      }catch(e){}
      return qs;
    };
    const qa = await rewrite(fix(cross?.a));
    const qb = await rewrite(fix(cross?.b));
    S.cross = { a: qa||Local.doubts().a, b: qb||Local.doubts().b };
    S.a.answers=[]; S.b.answers=[];
    clearInterval(tick); save();
    await wait(350);
    if(TOKEN!==my) return;
    go(S.mode==="pair" ? (S.seat==="b"?"doubtsB":"doubtsA") : "doubtsA");
  })();
  return n;
}

   17. DOUBTS — answering the mediator's questions, out loud
   --------------------------------------------------------------- */
function Doubts(side){
  const st=S[side];
  const qs = (S.cross&&S.cross[side]) || Local.doubts()[side];
  st.answers = st.answers||[];
  Sky.setMerge(.55); Sky.setEnergy(.4); Sky.setFocus(1);

  const n=stage(voiceShell({
    title:"A few things to check", back:false, side,
    name:`${st.name}, one more round`, meta:`${Math.min(st.answers.length+1,qs.length)} of ${qs.length}`
  }));

  const room = VoiceRoom(n,{
    next: async (onText)=>{
      const i = st.answers.length;
      const L = spokenLang();
      const t = i>=qs.length
        ? (L==="Malayalam" ? "എനിക്ക് വേണ്ടതെല്ലാം കിട്ടി. തിരികെ പറഞ്ഞതിന് നന്ദി. <ENOUGH>"
          : L==="Hindi" ? "मुझे सब कुछ मिल गया। दोबारा बताने के लिए धन्यवाद। <ENOUGH>"
          : "That's everything I needed. Thank you for going back over it. <ENOUGH>")
        : (i===0 ? (L==="Malayalam" ? `കാത്തിരുന്നതിന് നന്ദി. രണ്ടുപേരുടെയും പറഞ്ഞത് ഞാൻ വായിച്ചു. രണ്ട് കാര്യങ്ങൾ എനിക്ക് കൃത്യമാക്കണം. ${qs[0]}`
          : L==="Hindi" ? `धन्यवाद, मैंने दोनों की बातें पढ़ लीं। दो बातें मुझे साफ़ करनी हैं। ${qs[0]}`
          : `Thanks for waiting. I've read both accounts and there are two things I want to get right. ${qs[0]}`)
          : qs[i]);
      onText({text:t});
      return t;
    },
    onUser: t=>{ st.answers.push(t); save(); room.setMeta(`${Math.min(st.answers.length+1,qs.length)} of ${qs.length}`);
                 room.setRail(Math.round(st.answers.length/qs.length*100)); },
    onAI: ()=> st.answers.length>=qs.length,
    onFinish: ()=>{
      st.crossDone=true; save();
      const next = ()=>{
        if(S.mode==="pair") return go("hold2");
        return go(side==="a" ? "sealD" : "synth");
      };
      $("#hint",n).innerHTML=`<button class="btn ${side}" id="fin">${
        S.mode==="pair" ? "Done" : (side==="a" ? `Pass to ${esc(S.b.name)}` : "See what the mediator found")}</button>`;
      $("#fin",n).onclick=next;
    }
  });
  room.setRail(Math.round(st.answers.length/qs.length*100));
  room.speakNext();
  wireTop(n,null);
  return n;
}

/* ---------------------------------------------------------------
   17b. MEDIATE — the mediator talks to both of you, like a person.
   No report. No analysis screen. No score. One living conversation:
   the mediator opens from the heart, quietly picks who is carrying
   more of the misunderstanding, turns to that person first to look
   at the split moment through the other's eyes, hears each of you
   out — with real feelings, no questions unless needed — and lands
   on the one small thing that actually needs to happen.
   --------------------------------------------------------------- */
function chamberIntroPrompt(side){
  const me=S[side].name, o=side==="a"?S.b.name:S.a.name;
  const otherTold = side==="b"
    ? `\nThe other person, ${S.a.name}, already told me privately:\n${sideText("a")}\nYou already know their story — do not reuse a question you could be asking them instead.`
    : "";
  return `You are the mediator in "Obviously, I'm Right" — a real person with real feelings, not an interviewer. ${me} is about to tell you their side, privately, as ONE short moment — this is their only chance to speak alone before the live mediation.

This session is about "${S.topic||"what happened between them"}" — these two are ${S.relation||"two people who know each other"}.${otherTold}

Write ONE warm human question, at most 20 words, that opens the private telling with ${me} about THIS exact matter — about the split moment in this story, not a generic question. No labels, no bullets, no "how did that make you feel".

${LANG_LOCK()}

Reply with the single question only, no quotes.`;
}

function medContext(){
  return `Relationship: ${S.relation||"two people who know each other"} · About: "${S.topic||"something that happened"}"

=== ${S.a.name} said, privately ===
${sideText("a")}

=== ${S.b.name} said, privately ===
${sideText("b")}`;
}

function medPlanPrompt(){
  return `You are the mediator in "Obviously, I'm Right" — a real person with real feelings. You are NOT a report machine and NOT a summary writer. You are about to hold a short live conversation with two people together, after hearing each one privately. Every word of the plan below will be spoken aloud in the room's language.

${medContext()}

Before you write anything, quietly decide who is carrying more of the misunderstanding: compare the two accounts, and pick the person whose version conflicts more with the other's story. That person is who you will gently ask to look again through the other's eyes. The words "right" and "wrong" are banned.

SAFETY: if either person's words describe physical abuse, coercion or a threat of violence, reply with exactly this JSON and nothing else: {"stop":true}

Otherwise reply with ONLY this JSON, no fence:
{
 "wrong":"a or b",
 "opening":"speak to BOTH of them now, at most 45 words — people are waiting, so be short — warm and honest. Name what each one has been carrying, with real feeling, and name the ONE moment where their two stories split — in plain spoken language, no bullets, no labels, no analysis. End by speaking straight to the person you chose: tell them you want to walk them through that same moment from the other side, and that nothing here says they are wrong.",
 "askW":"ONE warm question, at most 20 words, to the person you chose: sit inside that split moment from the other person's side, and tell me what you see there now.",
 "askO":"ONE warm question, at most 20 words, to the other person about the same moment: their honest view of what that moment really was."
}
${LANG_LOCK()}`;
}

function medBridgePrompt(ans){
  const r=S.med||{}, A=S.a.name, B=S.b.name;
  const askO=(r.askO||"").trim();
  return `You are the mediator — a real person with real feelings, never a summary maker. A live mediation is moving fast and ${A} just answered you.

${medContext()}
You asked ${A}: "${r.askW||""}"
${A} answered: "${ans}"
Next you must speak to ${B}, in front of ${A}, about the same split moment.

Reply, out loud, at most 40 words, ONE flowing turn:
1. One honest line about what ${A}'s answer just showed you — use their own words if you can.
2. Then turn straight to ${B} and ask, word for word, exactly this question and nothing more: "${askO}"

No verdict. No report. No bullet points. Nobody is right or wrong here.
${LANG_LOCK()}`;
}

function medResolvePrompt(){
  const r=S.med||{};
  return `You are the mediator — a real person with real feelings, never a summary maker. A live mediation is ending. You just heard both people answer you.

${medContext()}
${S.a.name||"One"} answered you: "${r.aAns||""}"
${S.b.name||"One"} answered you: "${r.bAns||""}"

Speak the close, out loud, at most 70 words:
1. A warm line about what each of them just showed they now understand — use their own words where you can.
2. The ONE small thing that actually needs to happen between them this week, said plainly, not as a numbered list.
3. A kind final line for the two of them together.

No report. No verdict. No "in conclusion". No bullet points.
${LANG_LOCK()}`;

function Mediate(){
  Sky.setMerge(.95); Sky.setEnergy(.55); Sky.setFocus(1);
  const A=S.a.name, B=S.b.name, disp=s=>s==="a"?A:B;
  const r = (S.med && typeof S.med==="object" && "wrong" in S.med) ? S.med
    : (S.med={ wrong:"", opening:"", askW:"", askO:"", openingDone:false, planClaimed:false, aAns:"", bAns:"", aWho:"", bWho:"", res:"", done:false });
  save();
  const my=TOKEN, alive=()=>TOKEN===my;
  let lastUser="";
  const n=stage(voiceShell({ title:T("mediator"), back:false, side:"bloom", name:T("mediator"), meta:T("speaking") }));
  const mb=$("#mainBtn",n), kb=$("#kbd",n); mb.disabled=true; kb.disabled=true;   // stay quiet until the plan is ready
  const clean=s=>String(s).replace(/<ENOUGH>/g,"").trim();

  async function liveReply(promptFn, fallbackFn, onText, isClose){
    let t="";
    try{
      if(!AI.live()) throw {code:"offline"};
      t=String(await AI.chat([{role:"user",content:promptFn()}],{onText,tier:"default"})).trim();
    }catch(e){
      t=fallbackFn();
    }
    if(!t || t.length<4) t=fallbackFn();
    const L=spokenLang();
    if(L!=="English" && scriptPurity(L,clean(t))<0.8){
      const fr=await pureRewrite(L, clean(t)).catch(()=>"");
      if(fr && fr.length>4) t=fr;
    }
    return isClose ? clean(t)+" <ENOUGH>" : clean(t);
  }

  const P = (en,ml,hi)=> spokenLang()==="Malayalam" ? ml : spokenLang()==="Hindi" ? hi : en;
  const carryPct = ()=>{
    const pa = S.report && S.report.contribution && Number(S.report.contribution.a.pct);
    if(isFinite(pa)) return pa;
    const wa=words(sideText("a")), wb=words(sideText("b"));
    return clamp(Math.round(50+(wa-wb)/Math.max(wa+wb||1,1)*18),30,70);
  };
  function fallbackPlan(){
    const wrong=carryPct()>=50?"a":"b", o=wrong==="a"?"b":"a", W=disp(wrong), O=disp(o);
    return {
      wrong,
      opening: P(
        `Both of you came here hoping to be heard, and somewhere in this argument each of you went quiet about the thing that mattered most. That's the split I keep coming back to. ${W}, let's look at that same moment from ${O}'s side — not to prove anything, only to see what you couldn't from where you stood.`,
        `${A}, ${B} — രണ്ടുപേരുടെയും വാക്കുകൾ ഞാൻ കേട്ടു. ഈ വഴക്കിനുള്ളിൽ രണ്ടുപേർക്കും ഏറ്റവും വേദനിപ്പിച്ച കാര്യം പറയാതെ പോയതാണ് — അതാണ് ഞാൻ തിരികെ വരുന്ന നിമിഷം. ${W}, ആ നിമിഷം ${O}യുടെ കണ്ണിലൂടെ നോക്കാം — ഒന്നും തെളിയിക്കാനല്ല, നിങ്ങൾ നിന്നിടത്തു നിന്ന് കാണാനാകാത്തത് കാണാനാണ്.`,
        `${A}, ${B} — मैंने आप दोनों की बातें सुनीं। इस झगड़े के बीच दोनों वो बात नहीं कह पाए जो सबसे ज़रूरी थी — यही वो पल है जहाँ कहानियाँ बँट जाती हैं। ${W}, आइए उसी पल को ${O} की नज़र से देखें — कुछ साबित करने के लिए नहीं, बस वो देखने के लिए जो आप वहाँ खड़े होकर नहीं देख पाए।`
      ),
      askW: P(
        `${W}, sit inside that moment from ${O}'s side now — what do you think they actually felt, and what were they trying to protect?`,
        `${W}, ആ നിമിഷം ${O}യുടെ വശത്തുനിന്ന് നോക്കൂ — അവർക്ക് ശരിക്കും എന്താണ് തോന്നിയത്?`,
        `${W}, उसी पल को ${O} की तरफ़ से देखिए — उन्हें सच में क्या महसूस हुआ होगा?`
      ),
      askO: P(
        `${O}, in that same moment — what were you wishing ${W} would understand, and never said out loud?`,
        `${O}, ആ നിമിഷം — ${W} മനസ്സിലാക്കണമെന്ന് നിങ്ങൾ ആഗ്രഹിച്ചത് എന്തായിരുന്നു?`,
        `${O}, उसी पल में — आप चाहते थे ${W} क्या समझे, जो आपने कभी ज़ोर से नहीं कहा?`
      )
    };
  }
  function bridgeFallback(ans){
    const o = r.wrong==="a"?"b":"a", W=disp(r.wrong), O=disp(o);
    const lead = String(ans||"").trim();
    return P(
      `${lead?`"${lead.slice(0,80)}" — `:""}that took something to say, and I hear why. ${W}, thank you — I can see that moment differently now. ${O}, help me hold it from your side too: ${r.askO||""}`,
      `${W}, ഇത് പറയാൻ ധൈര്യം വേണ്ടിവന്നു — നന്ദി. ${O}, ആ നിമിഷം നിങ്ങളുടെ വശത്തുനിന്നും കേൾക്കട്ടെ: ${r.askO||""}`,
      `${W}, यह कहने के लिए हिम्मत चाहिए थी — शुक्रिया। ${O}, उसी पल को आपकी तरफ़ से भी सुनना चाहता हूँ: ${r.askO||""}`
    );
  }
  function resFallback(){
    return P(
      `${A} and ${B}, each of you just showed me the same thing from opposite ends — each of you wanted to matter to the other, and neither of you heard it until now. Neither of you is wrong. This week, say the one thing you've been waiting to be asked, out loud, plainly, once. That's the whole fix. I'm glad you stayed in the room.`,
      `${A}യും ${B}യും — രണ്ടുപേരും ഇന്ന് ഒരേ കാര്യം വിപരീത വശങ്ങളിൽ നിന്ന് കാണിച്ചു: ഓരോരുത്തരും മറ്റേയാൾക്ക് തങ്ങൾ പ്രധാനമാണെന്ന് വേണം. ആരും തെറ്റല്ല. ഈ ആഴ്ച, കാത്തിരുന്ന ചോദ്യം ഉറക്കെ ചോദിക്കൂ — സത്യസന്ധമായി, ഒരിക്കൽ. അതാണ് വേണ്ടത്. ഇവിടെ തങ്ങിയതിന് നന്ദി.`,
      `${A} और ${B}, आप दोनों ने आज वही चीज़ उलटी ओर से दिखाई — दोनों चाहते थे कि दूसरा उन्हें कीमती समझे। कोई ग़लत नहीं है। इस हफ़्ते वो बात कहिए जिसका जवाब आप इंतज़ार कर रहे थे — साफ़, एक बार। बस इतना ही। यहाँ रुकने के लिए धन्यवाद।`
    );
  }
  const room=VoiceRoom(n,{
    next: async (onText)=>{
      if(!r.opening) return "";
      if(!r.openingDone){
        r.openingDone=true; save();
        const opening=`${r.opening}\n\n${disp(r.wrong)}, ${r.askW}`;
        onText({text:opening});
        return opening;
      }
      if(!r.aAns){
        r.aAns=lastUser; r.aWho=S.mode==="pair"?(S.seat||r.wrong):r.wrong; save();
        return await liveReply(()=>medBridgePrompt(r.aAns), ()=>bridgeFallback(r.aAns), onText, false);
      }
      if(!r.bAns){
        r.bAns=lastUser; r.bWho=S.mode==="pair"?(S.seat||(r.wrong==="a"?"b":"a")):(r.wrong==="a"?"b":"a"); save();
        const close=await liveReply(()=>medResolvePrompt(), ()=>resFallback(), onText, true);
        r.res=clean(close); save();
        return close;
      }
      return "<ENOUGH>";
    },
    fallback: ()=>{
      if(!r.openingDone){
        const f=fallbackPlan(); r.wrong=f.wrong; r.opening=f.opening; r.askW=f.askW; r.askO=f.askO; r.openingDone=true; save();
        return `${f.opening}\n\n${disp(f.wrong)}, ${f.askW}`;
      }
      if(!r.aAns) return bridgeFallback(lastUser);
      return resFallback();
    },
    onUser: t=>{ lastUser=t; save(); },
    onAI: (t,enough)=> enough,
    onFinish: ()=>{
      r.done=true; save();
      setTimeout(()=>{ if(alive() && S.stage==="mediate") go("medEnd"); }, 1600);
    }
  });

  const vs=$("#vstate",n), cp=$("#cap",n);
  cp.textContent=""; vs.textContent=T("thinking"); vs.classList.remove("live");
  const enable=()=>{ if(!alive()) return; mb.disabled=false; kb.disabled=false; };
  (async()=>{
    if(r.opening){ enable(); return; }                    // plan already arrived from the other device
    if(r.planClaimed){                                     // other device is planning — wait for it
      const iv=setInterval(()=>{
        if(!alive() || S.stage!=="mediate"){ clearInterval(iv); return; }
        if(r.done==="stop"){ clearInterval(iv); go("medCare"); return; }
        if(r.opening){ clearInterval(iv); enable(); }
      },900);
      return;
    }
    r.planClaimed=true; save();
    try{
      if(!AI.live()) throw 0;
      const raw=await Promise.race([
        AI.chat([{role:"user",content:medPlanPrompt()}],{json:true,tier:"complex"}),
        wait(60000).then(()=>{ throw {code:"timed_out", message:"The mediator took too long planning"}; })
      ]);
      const p=pickJSON(raw);
      if(p && p.stop){ r.done="stop"; save(); await wait(350); if(alive()) go("medCare"); return; }
      if(!(p && p.opening && p.askW && p.askO)) throw 0;
      r.wrong=p.wrong==="b"?"b":"a"; r.opening=String(p.opening).trim(); r.askW=String(p.askW).trim(); r.askO=String(p.askO).trim(); save();
    }catch(e){
      const f=fallbackPlan(); r.wrong=f.wrong; r.opening=f.opening; r.askW=f.askW; r.askO=f.askO; save();
    }
    if(!alive() || r.done) return;
    enable();
    room.speakNext();
  })();

  wireTop(n,null);
  return n;
}
