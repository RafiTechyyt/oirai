/* ---------------------------------------------------------------
   18. SYNTHESIS
   --------------------------------------------------------------- */
function Synth(){
  Sky.setEnergy(1); Sky.setFocus(0);
  const steps=["Reading both accounts in full","Separating facts from feelings","Finding the assumptions underneath","Marking where the two stories split","Writing something you can both read"];
  const n=stage(`
    <div class="synth grow">
      <div style="height:clamp(110px,24dvh,200px)"></div>
      <div class="stack sm" style="text-align:center">
        <h2 class="h2">${S.round>1?"Rewriting it":"Bringing both sides together"}</h2>
        <p class="lede" style="margin-inline:auto">${S.round>1?"Taking the objection seriously, not just moving a number.":"Neither of you is being scored."}</p>
      </div>
      <div class="synthsteps">${steps.map((s,i)=>`<div class="sstep" data-i="${i}"><span class="sdot"></span><span>${esc(s)}</span></div>`).join("")}</div>
    </div>`);
  const my=TOKEN, all=n.querySelectorAll(".sstep"); let i=-1;
  const adv=()=>{ if(i>=0)all[i].classList.replace("on","done"); i++; if(i<all.length){all[i].classList.add("on"); Sky.setMerge(.2+i*.17);} };
  adv(); const tick=setInterval(adv,1500);

  (async()=>{
    const attempt = async ()=>{
      if(!AI.live()) throw {code:"offline"};
      return await AI.chat([{role:"user",content:synthesisPrompt()}],{json:true,tier:"complex"});
    };
    let rep;
    try{ rep = await attempt(); }
    catch(e){
      try{ await wait(1200); rep = await attempt(); }            // one honest retry
      catch(e2){ await wait(500); rep = Local.report(); }        // only true last resort
    }
    if(TOKEN!==my) return;
    clearInterval(tick);
    all.forEach(s=>{ s.classList.remove("on"); s.classList.add("done"); });
    S.report = await finaliseReport(rep); S.a.satisfied=null; S.b.satisfied=null;
    S.a.rebuttal=""; S.b.rebuttal=""; save();
    Sky.setMerge(1);
    await wait(800);
    if(TOKEN===my) go("convince");
  })();
  return n;
}

function normalise(r){
  const d=Local.report(); r=r||{};
  const arr=(v,f)=>Array.isArray(v)&&v.length?v:f;
  r.headline=r.headline||d.headline;
  r.commonGround=arr(r.commonGround,d.commonGround);
  r.truthMap=arr(r.truthMap,d.truthMap).map(x=>({what:x.what||"",kind:["agreed","disputed","unseen"].includes(x.kind)?x.kind:"unseen",a:x.a||"",b:x.b||""}));
  r.lenses=r.lenses||d.lenses;
  ["a","b"].forEach(k=>{ r.lenses[k]=r.lenses[k]||d.lenses[k];
    ["facts","feelings","assumptions"].forEach(f=>r.lenses[k][f]=arr(r.lenses[k][f],d.lenses[k][f])); });
  r.bridge=r.bridge||d.bridge; r.unsaid=r.unsaid||d.unsaid; r.contribution=r.contribution||d.contribution;
  let pa=Number(r.contribution.a?.pct); if(!isFinite(pa)) pa=50;
  pa=clamp(Math.round(pa),25,75); r.contribution.a.pct=pa; r.contribution.b.pct=100-pa;
  r.pact=arr(r.pact,d.pact).slice(0,4);
  r.apology=r.apology||d.apology; r.spoken=r.spoken||d.spoken; r.closing=r.closing||d.closing;
  return r;
}

/* If the room spoke Malayalam/Hindi but the model (or the offline fallback)
   produced a report that is not in that script — English, mixed languages,
   or Latin transliteration — quietly ask once for a full pure in-language
   rewrite. This is what keeps the summary locked to one language. */
async function finaliseReport(rep){
  let r = normalise(rep);
  const L = spokenLang();
  const pure = v=>scriptPurity(L, valuesOnly(v));
  if(L!=="English" && pure(r)<0.85){
    try{
      if(AI.live()){
        const again = await AI.chat([{role:"user",content:
          synthesisPrompt()+"\n\nHARD REQUIREMENT: this mediation happened in "+L+". Your last draft is unreadable — it mixes "+L+" with English and other languages, or transliterates into Latin letters. Rewrite it so EVERY value in the JSON is pure "+L+" script: no English, no other language, no Latin transliteration, no mixing. Keep the JSON keys exactly as they are. Return the corrected JSON now."}],{json:true,tier:"complex"});
        if(again){
          const nn = normalise(again);
          if(pure(nn)>=0.85 || pure(nn)>pure(r)) r = nn;
        }
      }
    }catch(e){}
  }
  return r;
}

/* ---------------------------------------------------------------
   19. CONVINCE — the mediator's word, then the shoes-walking
   No report card. The mediator reads aloud the one thing at the
   heart of it, privately speaks (out loud) to the one carrying
   more of the misunderstanding — never calling anyone wrong — and
   sends both into the perspective flip, that person first.
   --------------------------------------------------------------- */
function convincePrompt(who){
  const o=who==="a"?"b":"a", A=S.a.name, B=S.b.name;
  const me=who==="a"?A:B, them=o==="a"?A:B;
  const r=S.report||{};
  const split=(r.truthMap||[]).filter(x=>x.kind!=="agreed").slice(0,2)
    .map(x=>`- ${x.what}: you told it as "${who==="a"?x.a:x.b}", ${them} told it as "${who==="a"?x.b:x.a}"`).join("\n");
  return `You are the mediator in "Obviously, I'm Right". You have heard both sides and their clarifications, and you will NEVER tell anyone they are wrong. Right now you are speaking to ${me} alone, out loud, before both people walk in each other's shoes.

${VOICE_STYLE}

First, name back to ${me} what they have been feeling and holding, straight from their own words — plainly, with warmth, no flattery and no judgement.
Then show them the one moment where the two accounts truly split:
${split||`- the silence itself: nothing about that moment ever got said out loud`}
Ask ${me}, with real feeling, to sit inside that moment from ${them}'s side: what it must have felt like over there, and which part ${me} cannot see from here. Hold no verdict, no defence of ${them}, no accusation of ${me}.
End by telling ${me} you are about to walk them through ${them}'s eyes, and that nothing in that walk will be used to say they were wrong.

Under 90 words. No question marks. No list beyond the split moment.${LANG_LOCK()}`;
}

function Convince(){
  Sky.setMerge(1); Sky.setEnergy(.5); Sky.setFocus(0);
  const r=S.report, A=S.a.name, B=S.b.name;
  const pa=Number(r.contribution&&r.contribution.a&&r.contribution.a.pct);
  const hold = (isFinite(pa)?pa:50) >= 50 ? "a" : "b";
  const wrong = hold==="a"?A:B, right = hold==="a"?B:A;

  const n=stage(`
    ${topbar("The mediator's word",false)}
    <div class="findings">
      <div class="stack" style="padding-top:2px">
        <p class="tiny">Round ${S.round} · nobody here is being called right or wrong</p>
        <h1 class="headline">${esc(r.headline)}</h1>
        <button class="btn ghost sm" id="playAll" style="width:auto;justify-self:start">${ICON.vol} Hear it from the mediator</button>
        <p class="lede" id="spokenTxt" hidden style="font-size:15.5px">${esc(r.spoken)}</p>
      </div>

      <div class="sect"><h3 class="h3">A word for ${esc(wrong)}, just for you</h3>
        <p class="lede">The mediator wants one private minute with ${esc(wrong)} — out loud, on this screen.</p>
        <div class="card"><p style="font-size:16px;line-height:1.65;white-space:pre-wrap" id="convTxt">…</p></div>
        <p class="tiny" id="convHint" style="margin-top:9px">You will never be told you were wrong. This is only about seeing the same moment from over there.</p></div>

      <div class="sect"><h3 class="h3">The way out</h3>
        <div class="stack">${r.pact.map((p,i)=>`<div class="pactitem"><span class="pactnum">${i+1}</span><span style="font-size:14.5px;line-height:1.55">${esc(p)}</span></div>`).join("")}</div></div>
    </div>
    <div class="stack" style="padding-top:10px">
      <button class="btn bloom" id="begin" disabled>${esc(wrong)} — first step into ${esc(right)}'s shoes</button>
      <button class="linkish" id="restart" style="text-align:center">Start a different mediation</button>
    </div>`);

  const play=$("#playAll",n), sp=$("#spokenTxt",n);
  play.onclick=()=>{
    if(Speak.busy){ Speak.cancel(); play.innerHTML=`${ICON.vol} Hear it from the mediator`; return; }
    sp.hidden=false; Speak.reset(); Speak.enabled=true;
    play.innerHTML=`${ICON.stop} Stop`;
    Speak.flush(r.spoken, ()=>{ play.innerHTML=`${ICON.vol} Hear it again`; });
  };

  const ct=$("#convTxt",n), hint=$("#convHint",n), begin=$("#begin",n);
  const my=TOKEN;
  (async()=>{
    let t="";
    try{
      if(!AI.live()) throw {code:"offline"};
      t = String(await AI.chat([{role:"user",content:convincePrompt(hold)}],
        {tier:"default", onText:({text:s})=>{ if(TOKEN===my) ct.textContent=s; }})).trim();
    }catch(e){
      const L=spokenLang();
      t = L==="Malayalam"
        ? `${wrong}, ഈ നിശബ്ദതയിൽ നിങ്ങൾ എന്താണ് വഹിക്കുന്നതെന്ന് ഞാൻ കേട്ടു. ഈ നിമിഷം ${right}യുടെ കണ്ണിലൂടെ കാണാനുള്ള അനുഗ്രഹം മാത്രം നിങ്ങൾക്ക് നൽകാം. എന്റെ കൂടെ വരൂ.`
        : L==="Hindi"
        ? `${wrong}, मैंने सुना कि आप यह कितना पकड़े हुए हैं। यही पल ${right} की नज़र से देखना — यह आप ही दे सकते हैं। मेरे साथ चलिए।`
        : `${wrong}, I've heard how much you've been holding onto this. There's one thing only you can give ${right} — the grace of seeing that same moment through their eyes. Walk with me.`;
    }
    if(TOKEN!==my) return;
    if(t){ ct.textContent=t; hint.hidden=true; }
    begin.disabled=false;
  })();

  begin.onclick=()=>{ S.flip.order=hold; S.flip.a.done=false; S.flip.b.done=false; save(); go("flip"); };
  $("#restart",n).onclick=reset;
  wireTop(n,null);
  return n;
}

/* ---------------------------------------------------------------
   20. REBUTTAL — the mediator hears the objection
   --------------------------------------------------------------- */
function pendingSide(){
  if(S.a.satisfied===false && !S.a.rebuttal) return "a";
  if(S.b.satisfied===false && !S.b.rebuttal) return "b";
  return null;
}
function Rebuttal(){
  const side = pendingSide();
  if(!side) return (go("persuade"), stage(""));
  const st=S[side];
  Sky.setMerge(.6); Sky.setEnergy(.5); Sky.setFocus(1);
  const n=stage(voiceShell({title:"What's still wrong",back:false,side,name:`${st.name}, tell it straight`,meta:"round "+S.round}));
  let asked=false;
  const room=VoiceRoom(n,{
    next: async(onText)=>{
      const L = spokenLang();
      if(asked) return (L==="Malayalam" ? "മനസ്സിലായി. അത് ഗൗരവമായി എടുത്ത് ഞാൻ വീണ്ടും എഴുതാം. <ENOUGH>"
        : L==="Hindi" ? "समझ गया। मैं इसे गंभीरता से लूँगा और फिर से लिखूँगा। <ENOUGH>"
        : "Got it. I'll take that seriously and write it again. <ENOUGH>");
      asked=true;
      const t=L==="Malayalam"
        ? "ഇത് നിങ്ങൾക്ക് ഇനിയും ശരിയാകുന്നില്ലെന്ന് ഞാൻ മനസ്സിലാക്കി. ഏത് ഭാഗമാണ് തെറ്റ് എന്ന് പറയൂ — എല്ലാം വേണ്ട, 'അല്ല' എന്ന് നിങ്ങളെക്കൊണ്ട് പറയിച്ച ഭാഗം മാത്രം."
        : L==="Hindi"
        ? "मुझे पता चला कि यह अभी आपको सही नहीं लग रहा। बताइए कि कौन सा हिस्सा गलत है — सब कुछ नहीं, बस वही हिस्सा जिसने आपको 'ना' कहने पर मजबूर किया।"
        : `I heard you say it doesn't land yet. Tell me the part that's wrong — not all of it, just the piece that made you say no.`;
      onText({text:t}); return t;
    },
    onUser: t=>{ st.rebuttal=t; save(); },
    onAI: ()=> !!st.rebuttal,
    onFinish: ()=>{
      $("#hint",n).innerHTML=`<button class="btn ${side}" id="fin">Continue</button>`;
      $("#fin",n).onclick=()=>{ const more=pendingSide(); go(more?"rebuttal":"persuade"); };
    }
  });
  room.setRail(50); room.speakNext();
  wireTop(n,null); return n;
}

/* ---------------------------------------------------------------
   21. PERSUADE — spoken directly to whoever is still holding out
   --------------------------------------------------------------- */
function Persuade(){
  const holdout = S.a.satisfied===false ? "a" : S.b.satisfied===false ? "b" : null;
  if(!holdout){ S.round++; return (go("mediate"), stage("")); }
  const other = holdout==="a" ? "b" : "a";
  const both = S.a.satisfied===false && S.b.satisfied===false;
  Sky.setMerge(.7); Sky.setEnergy(.8); Sky.setFocus(1);

  const n=stage(`
    ${topbar("One more thing",false)}
    <div class="voice grow">
      <div class="voicestage"><div class="vorb"><span class="vstate live" id="vstate">speaking</span></div></div>
      <div class="caption" id="cap"></div>
      <div class="stack" style="padding-top:12px">
        <button class="btn bloom" id="again">Write it again, properly</button>
        <button class="linkish" id="skip" style="text-align:center">Accept it as it stands</button>
      </div></div>`);
  const my=TOKEN, cap=$("#cap",n);
  (async()=>{
    let text="";
    try{
      if(!AI.live()) throw {code:"offline"};
      text = await AI.chat([{role:"user",content: both
        ? `You are the mediator in "Obviously, I'm Right". BOTH ${S.a.name} and ${S.b.name} say the summary doesn't land.\n\n${VOICE_STYLE}\n\n${LANG_LOCK()}\n\n${S.a.name} objected: "${S.a.rebuttal}"\n${S.b.name} objected: "${S.b.rebuttal}"\n\nSay something to the two of them together, out loud, under 70 words. Notice what their two objections have in common — that is usually the real conflict. Be warm and direct. No lists.`
        : persuadePrompt(S[holdout].name, S[other].name)}],
        {tier:"default", onText:({text:t})=>{ if(TOKEN===my){ cap.textContent=t; Speak.feed(t); } }});
    }catch(e){
      text = `${S[holdout].name}, you're allowed to still be angry. But holding the line here costs you something real, and it isn't the argument. Tell me the piece that's wrong and I'll write it again — properly this time, not just softer.`;
      cap.textContent=text;
    }
    if(TOKEN!==my) return;
    cap.textContent=String(text).trim();
    Speak.flush(String(text).trim(), ()=>{ const v=$("#vstate",n); if(v){ v.textContent="your call"; v.classList.remove("live"); } });
  })();
  $("#again",n).onclick=()=>{ S.round++; save(); go("synth"); };
  $("#skip",n).onclick=()=>{ S.a.satisfied=true; S.b.satisfied=true; save(); go("sealed"); };
  wireTop(n,null); return n;
}

/* ---------------------------------------------------------------
/* ---------------------------------------------------------------
   22. THE PERSPECTIVE FLIP
   After both accept the summary, each person briefly experiences
   the dispute through the other person's eyes. Shared-screen — one
   flip runs, then the other. Everything stays in the room's
   language, self-claims get reframed as on-trust assumptions
   (the "I like chocolate" pattern), and the exercise stands down
   cleanly if the conflict reads as a safety situation.
   --------------------------------------------------------------- */
function flipPrompt(who){
  const o = who==="a"?"b":"a";
  const A=S.a.name, B=S.b.name, T=S.topic||"this";
  const r=S.report||{};
  const R = {headline:r.headline||"", commonGround:r.commonGround||[], truthMap:r.truthMap||[], bridge:r.bridge||{}, contribution:r.contribution||{}};
  const me = who==="a"?A:B, them = who==="a"?B:A;
  return `You are the "Perspective Flip" module inside "Obviously, I'm Right", a two-sided conflict mediator. You are building a guided perspective-flip exercise FOR ${me}, the ${who==="a"?"first":"second"} person, to help them temporarily understand the emotional perspective, assumptions, motivations and inner logic of ${them}, the ${o==="a"?"first":"second"} person.

Hard rules:
- Never decide who is right. Never claim to know exactly what ${them} felt or thought.
- Separate clearly what ${them} actually STATED (below) from what you only INFER.
- Never invent events, intentions, memories or emotions. Never push anyone to accept blame. Never ridicule, shame or attack. Stay neutral, warm and safe.
- Do not reveal private information ${me} asked to keep confidential.
- LANGUAGE: This entire exercise will be spoken aloud in ${spokenLang()} to a person who asked for ${spokenLang()}. Write EVERY word in ${spokenLang()} — every sentence, list item and label. Not one English word may survive. This is mandatory.

=== SAFETY STOP ===
If either side's statements describe a threat of violence, physical abuse, coercion, or endangering of a person or child — do NOT build a flip. Reply with exactly the five words SAFETY_STOP REQUIRED and nothing else.

=== WHAT TO BUILD FROM ===
Relationship: ${S.relation||"two people"} · About: "${T}" · Round ${S.round}.

--- What ${me} told the mediator privately ---
${sideText(who)}

--- What ${them} told the mediator privately ---
${sideText(o)}

--- The mediator's analysis so far ---
${JSON.stringify(R)}

=== THE ASSUMPTION REFRAME (this is the heart of the exercise) ===
When someone says something positive, neutral or self-descriptive about themselves — "I like chocolate" is the classic case — that is THEIR OWN CLAIM about themselves. The other person can never fully verify it; from that other side it is fundamentally a belief held on trust.

Make this visible in the exercise, in both directions:
For ${me}: "${me}, you have been treating it as fact that ${them} likes [thing]. That is ${them}'s claim about themselves, which you can only accept on trust — and you may be building judgments on it without noticing the trust involved."
For ${them} (inside the bridge): "${them} has been acting on a self-belief of ${me}'s the same way."
Use the real self-claims these two actually made where they exist; the chocolate line is just the pattern to follow.

=== OUTPUT: ONLY this JSON, no fence ===
{
 "intro":"2-3 sentences stating where ${them} is coming from. Documented points first; clearly mark anything inferred.",
 "emotions":[{"event":"one concrete event","theirRead":"how ${them} interpreted it","theirFeeling":"what they felt","theirAction":"what they did"}, add 2-3],
 "assumptions":["1-3, each reframing a self-claim or positive of one side into the on-trust assumption it really is, exactly like the chocolate example"],
 "roleplay":{"setup":"You are ${them} now. Put yourself in their actual situation, using the events above. 2-3 sentences.","question":"What would you do or say right now?"},
 "roleplayNote":"One short sentence comparing what ${me} would probably do with what ${them} actually reported doing or saying.",
 "gap":{"youThought":"what ${me} believed, short and exact","theySaid":"what ${them} actually said about that point, quoted if possible","misunderstanding":"the single misunderstanding in one plain sentence"},
 "bridge":{"aboutThem":"What ${me} may have misunderstood about ${them}, 1-2 sentences","aboutYou":"What ${them} may have misunderstood about ${me}, 1-2 sentences","bothNow":"What both can understand now, 1-2 sentences"},
 "resolution":{"q1":"One thing ${me} would like ${them} to understand about them","q2":"One thing ${me} is willing to change","statement":"Joint understanding: one or two warm sentences, naming both people and that both cared but read the same moments differently"}
}
${LANG_LOCK()}`;
}

const pickJSON = s=>{
  s=String(s||"").trim();
  const f=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(f) s=f[1].trim();
  const i=s.indexOf("{"), j=s.lastIndexOf("}");
  if(i>=0 && j>i) s=s.slice(i,j+1);
  return JSON.parse(s);
};

async function FlipGen(){
  const my=TOKEN;
  try{
    if(!AI.live()) throw {code:"offline"};
    const [ra,rb] = await Promise.all([
      AI.chat([{role:"user",content:flipPrompt("a")}],{tier:"complex"}),
      AI.chat([{role:"user",content:flipPrompt("b")}],{tier:"complex"})
    ]);
    if(TOKEN!==my) return;
    if(/SAFETY_STOP/i.test(String(ra)) || /SAFETY_STOP/i.test(String(rb))){ S.flip.stop=true; save(); go("flip"); return; }
    S.flip.a.script = pickJSON(ra);
    S.flip.b.script = pickJSON(rb);
    if(TOKEN!==my) return;
    const L = spokenLang();
    if(L!=="English"){
      const names = ((S.a.name||"")+" "+(S.b.name||"")).split(/\s+/).filter(w=>/^[A-Za-z]/.test(w));
      const foreignWords = sc => (JSON.stringify(valuesOnly(sc)).match(/[A-Za-z]{3,}/g)||[]).filter(w=>!names.includes(w)).length;
      const needs = sc => !sc || scriptPurity(L, valuesOnly(sc)) < 0.9 || foreignWords(sc) > 2;
      const scold = w => "HARD REQUIREMENT: this flip must be written entirely in pure "+L+". The previous draft mixes "+L+" with English or other languages, or uses Latin transliteration. Rewrite the ENTIRE JSON so every value is pure "+L+" script: no English, no other language, no Latin letters, no mixing. Keep the JSON keys exactly as they are.";
      if(needs(S.flip.a.script)){
        try{
          const again = await AI.chat([{role:"user",content:flipPrompt("a")+"\n\n"+scold("a")}],{tier:"complex"});
          S.flip.a.script = pickJSON(again);
        }catch(e){}
      }
      if(needs(S.flip.b.script)){
        try{
          const again = await AI.chat([{role:"user",content:flipPrompt("b")+"\n\n"+scold("b")}],{tier:"complex"});
          S.flip.b.script = pickJSON(again);
        }catch(e){}
      }
    }
    save(); go("flip");
  }catch(e){
    if(TOKEN!==my) return;
    S.flip.fail=true; save(); go("flip");
  }
}

function Flip(){
  Sky.setMerge(.85);
  if(S.flip.stop) return FlipUnsafe();
  const A=S.flip.a, B=S.flip.b;
  if(!S.flip.fail && !A.script && !B.script){ FlipGen(); return FlipLoading(); }
  if(S.flip.fail && !A.script && !B.script) return FlipSkipScreen();
  if(S.flip.order==="b"){ if(!B.done) return FlipRun("b"); if(!A.done) return FlipRun("a"); }
  if(!A.done) return FlipRun("a");
  if(!B.done) return FlipRun("b");
  return FlipDone();
}

function FlipLoading(){
  Sky.setMerge(.85); Sky.setEnergy(.5); Sky.setFocus(0);
  const n=stage(`
    <div class="synth grow">
      <div style="height:clamp(110px,24dvh,200px)"></div>
      <div class="stack sm" style="text-align:center">
        <h2 class="h2">${esc(T("buildH"))}</h2>
        <p class="lede" style="margin-inline:auto">${esc(Tt("buildS",{N:S.a.name,M:S.b.name}))}</p>
      </div>
      <div class="waiting"><i></i><span>${esc(T("buildW"))}</span></div></div>`);
  wireTop(n,null); return n;
}

function FlipUnsafe(){
  Sky.setMerge(.85); Sky.setEnergy(.3); Sky.setFocus(0);
  const n=stage(`
    ${topbar(T("flip"),false)}
    <div class="grow center" style="display:flex;flex-direction:column;gap:20px;text-align:center">
      <div class="sealmark" style="width:96px;height:96px">${ICON.lock}</div>
      <div class="stack sm" style="margin-inline:auto;max-width:44ch">
        <h2 class="h2">${esc(T("unsafeH"))}</h2>
        <p class="lede">${esc(T("unsafeP"))}</p>
      </div>
    </div>
    <div class="stack"><button class="btn ghost" id="cont">${esc(T("unsafeB"))}</button></div>`);
  $("#cont",n).onclick=()=>go("sealed");
  wireTop(n,null); return n;
}

function FlipSkipScreen(){
  Sky.setMerge(.85); Sky.setEnergy(.4); Sky.setFocus(0);
  const n=stage(`
    ${topbar(T("flip"),false)}
    <div class="grow center" style="display:flex;flex-direction:column;gap:20px;text-align:center">
      <div class="stack sm" style="margin-inline:auto;max-width:44ch">
        <h2 class="h2">${esc(T("skipH"))}</h2>
        <p class="lede">${esc(T("skipP"))}</p>
      </div>
    </div>
    <div class="stack"><button class="btn bloom" id="retry">${esc(T("tryAgain"))}</button>
      <button class="linkish" id="skip" style="text-align:center">${esc(T("skip"))}</button></div>`);
  $("#retry",n).onclick=()=>{ S.flip.fail=false; S.flip.a.script=null; S.flip.b.script=null; save(); go("flip"); };
  $("#skip",n).onclick=()=>go("sealed");
  wireTop(n,null); return n;
}

function FlipRun(side){
  const st=S.flip[side], who=S[side], o=side==="a"?"b":"a", other=S[o], sc=st.script;
  Sky.setMerge(.85); Sky.setEnergy(.55); Sky.setFocus(1);
  const n=stage(`
    ${topbar(T("flip"),false)}
    <div class="whobar"><span class="dot ${side}"></span>
      <span class="name">${esc(who.name)}${esc(Tt("eyeOf",{N:other.name}))}</span>
      <span class="meta" id="flmeta">${esc(T("step"))} 1 ${esc(T("of"))} 1</span></div>
    <div class="rail ${side}"><i id="flrail" style="width:0%"></i></div>
    <div class="voice grow">
      <div class="voicestage"><div class="vorb"><span class="vstate live" id="vstate">${esc(T("speaking"))}</span></div></div>
      <div class="caption" id="cap" style="white-space:pre-wrap"></div>
      <div id="flask"></div>
      <p class="tiny" id="flhint" style="text-align:center;padding-top:8px"></p>
    </div>`);
  wireTop(n,null);

  const cards=[];
  cards.push({k:"narrate", t:Tp("intro", other.name, who.name)});
  if(sc.intro) cards.push({k:"narrate", head:T("from"), t:sc.intro});
  (sc.emotions||[]).forEach(e=>cards.push({k:"narrate", head:T("emoHead"), t:Tt("emo",{N:other.name,Q:e.event,R:e.theirRead,F:e.theirFeeling,A:e.theirAction})}));
  (sc.assumptions||[]).forEach(a=>cards.push({k:"narrate", head:T("asm"), t:a}));
  if(sc.roleplay){
    cards.push({k:"narrate", head:T("rpHead"), t:sc.roleplay.setup});
    cards.push({k:"ask", head:T("rpAsk"), t:sc.roleplay.question});
    cards.push({k:"narrate", head:T("hold"), t:sc.roleplayNote});
  }
  if(sc.gap) cards.push({k:"gap", gap:sc.gap});
  if(sc.bridge) cards.push({k:"bridge", bridge:sc.bridge});
  if(sc.resolution){
    cards.push({k:"ask", head:T("res1"), t:sc.resolution.q1});
    cards.push({k:"ask", head:T("res2"), t:sc.resolution.q2});
    cards.push({k:"narrate", head:T("resStmt"), t:sc.resolution.statement});
  }
  cards.push({k:"end"});

  const cap=$("#cap",n), vst=$("#vstate",n), meta=$("#flmeta",n), rail=$("#flrail",n), hint=$("#flhint",n), askBox=$("#flask",n);
  const my=TOKEN;
  const alive=()=>TOKEN===my;
  let i=(st.idx||0)-1, answers=(st.answers||[]).slice();
  let said="";

  function narrate(card){
    vst.textContent= Speak.enabled?T("speaking"):T("reading"); vst.classList.add("live");
    cap.textContent=(card.head?card.head+"\n\n":"")+card.t;
    try{ Speak.cancel(); Speak.feed(card.t); Speak.flush(card.t,()=>{ if(alive() && cited===i) vst.textContent=T("done"); }); }catch(e){}
    const next=cards[i+1];
    const w = next ? (next.k==="ask" ? T("your turn") : T("continue")) : T("finish");
    hint.innerHTML=`<button class="btn ${side}" id="flnext">${esc(T("next"))} — ${esc(w)}</button>`;
    $("#flnext",n).onclick=renderCard;
  }

  function showAsk(card){
    vst.textContent=T("your turn"); vst.classList.remove("live");
    cap.textContent=(card.head?card.head+"\n\n":"")+card.t;
    askBox.innerHTML=`<div class="composer" style="border-top:1px solid var(--hair);padding-top:10px;margin-top:12px">
        <textarea class="ta" id="flsay" rows="2" placeholder="${esc(T("phSay"))}"></textarea>
        <div class="btnrow" style="margin-top:8px">
          <button class="btn sm ghost" id="flmic" style="${Ears.supported()?"":"display:none"}">${ICON.mic} ${esc(T("say"))}</button>
          <button class="btn sm ${side}" id="flok">${esc(T("doneKeep"))}</button>
        </div></div>`;
    const say=$("#flsay",n), ok=$("#flok",n), mic=$("#flmic",n);
    said="";
    const settle=()=>{
      const v=(said||say.value).trim(); if(!v){ hint.textContent=T("first"); return; }
      Ears.stop(false,true);
      answers.push(v); st.answers=answers.slice(); st.idx=i; save();
      hint.textContent=T("noted");
      say.value="";
      renderCard();
    };
    mic.onclick=()=>{
      if(Ears.listening){ Ears.stop(true); return; }
      said=""; say.value=""; hint.textContent=T("listening"); mic.innerHTML=ICON.stop; mic.classList.add("bloom");
      Ears.start({
        partial:t=>{ say.value=t; },
        final:t=>{ said=t; say.value=t; },
        onHeld:()=>{ if(alive()){ hint.textContent=T("catch"); mic.innerHTML=ICON.mic; mic.classList.remove("bloom"); } }
      });
    };
    ok.onclick=settle;
    say.addEventListener("keydown",e=>{ if(e.key==="Enter") settle(); });
    setTimeout(()=>say.focus(),80);
  }

  let cited=null;

  function renderCard(){
    if(!alive()) return;
    i++;
    const card=cards[i];
    meta.textContent=`${T("step")} ${Math.min(i+1,cards.length)} ${T("of")} ${cards.length}`;
    rail.style.width=Math.round((i+1)/cards.length*100)+"%";
    cited=i;
    askBox.innerHTML=""; hint.textContent="";
    if(!card){ return finish(); }
    if(card.k==="narrate") return narrate(card);
    if(card.k==="ask") return showAsk(card);
    if(card.k==="gap"){
      vst.textContent=T("the gap"); vst.classList.remove("live"); cap.textContent="";
      const g=card.gap;
      askBox.innerHTML=`<div class="stack" style="padding-top:10px">
        <div class="card ${side}"><div class="side-label ${side}"><span class="dot ${side}"></span>${esc(Tt("gapYTh",{N:who.name}))}</div>
          <p style="font-size:15px;line-height:1.5">${esc(g.youThought)}</p></div>
        <div class="card ${o}"><div class="side-label ${o}"><span class="dot ${o}"></span>${esc(Tt("gapSaid",{N:other.name}))}</div>
          <p style="font-size:15px;line-height:1.5">"${esc(g.theySaid)}"</p></div>
        <div class="card bloom"><div class="side-label bloom"><span class="dot bloom"></span>${esc(T("gapMis"))}</div>
          <p style="font-size:15px;line-height:1.5">${esc(g.misunderstanding)}</p></div>
        <button class="btn ${side}" id="flnext">${esc(T("next"))}</button></div>`;
      try{ Speak.cancel(); Speak.feed(g.misunderstanding); Speak.flush(g.misunderstanding,()=>{}); }catch(e){}
      $("#flnext",n).onclick=renderCard;
      return;
    }
    if(card.k==="bridge"){
      vst.textContent=T("the bridge"); vst.classList.remove("live"); cap.textContent="";
      const b=card.bridge;
      askBox.innerHTML=`<div class="stack" style="padding-top:10px">
        <div class="card"><p style="font-size:14px;line-height:1.5"><b>${esc(Tt("brThem",{N:who.name,M:other.name}))}</b><br><span style="color:var(--mist)">${esc(b.aboutThem)}</span></p></div>
        <div class="card"><p style="font-size:14px;line-height:1.5"><b>${esc(Tt("brYou",{N:other.name,M:who.name}))}</b><br><span style="color:var(--mist)">${esc(b.aboutYou)}</span></p></div>
        <div class="card bloom"><p style="font-size:14px;line-height:1.5"><b>${esc(T("brBoth"))}</b><br>${esc(b.bothNow)}</p></div>
        <button class="btn ${side}" id="flnext">${esc(T("next"))}</button></div>`;
      $("#flnext",n).onclick=renderCard;
      return;
    }
  }

  function finish(){
    S.flip[side].done=true;
    S.flip[side].answers=answers;
    S.flip[side].statement=(sc.resolution&&sc.resolution.statement)||"";
    S.flip[side].idx=0;
    save();
    go("flip");
  }

  renderCard();
  return n;
}

function FlipDone(){
  Sky.setMerge(1); Sky.setEnergy(.6); Sky.setFocus(0);
  const sa=S.flip.a.statement||S.flip.a.script?.resolution?.statement||"";
  const sb=S.flip.b.statement||S.flip.b.script?.resolution?.statement||"";
  const n=stage(`
    ${topbar(T("flip"),false)}
    <div class="grow stack lg">
      <div><h2 class="h2">${esc(T("bothH"))}</h2>
        <p class="lede" style="margin-top:9px">${esc(T("bothP"))}</p></div>
      <div class="stack">
        <div class="card a"><div class="side-label a"><span class="dot a"></span>${esc(S.a.name)} ${esc(T("said"))}</div>
          <p style="font-size:15.5px;margin-top:10px;line-height:1.55">${esc(sa||T("sawOther"))}</p></div>
        <div class="card b"><div class="side-label b"><span class="dot b"></span>${esc(S.b.name)} ${esc(T("said"))}</div>
          <p style="font-size:15.5px;margin-top:10px;line-height:1.55">${esc(sb||T("sawOther"))}</p></div>
      </div>
    </div>
    <div class="stack"><button class="btn bloom" id="goSeal">${esc(T("close"))}</button></div>`);
  $("#goSeal",n).onclick=()=>go("sealed");
  wireTop(n,null); return n;
}

/* ---------------------------------------------------------------
   23. SEALED   22. SEALED
   --------------------------------------------------------------- */
function Sealed(){
  Sky.setMerge(1); Sky.setEnergy(1); Sky.setFocus(0);
  const r=S.report;
  const sa=S.flip.a.statement||S.flip.a.script?.resolution?.statement||"";
  const sb=S.flip.b.statement||S.flip.b.script?.resolution?.statement||"";
  const hasFlip = !!(sa||sb);
  const n=stage(`
    <div class="grow center" style="display:flex;flex-direction:column;gap:24px;text-align:center">
      <div class="orbwrap" style="height:min(26dvh,190px)"></div>
      <div class="stack"><h1 class="h2">${esc(S.a.name)} and ${esc(S.b.name)} — you walked in each other's shoes.</h1>
        <p class="headline" style="color:var(--mist);font-size:19px;margin-top:10px">${esc(r.closing)}</p></div>
      ${hasFlip?`<div class="card bloom" style="text-align:left"><div class="stack sm">
        <p class="tiny" style="color:var(--bloom)">${esc(T("through"))}</p>
        ${sa?`<p style="font-size:14px;line-height:1.55">${esc(S.a.name)}: "${esc(sa)}"</p>`:""}
        ${sb?`<p style="font-size:14px;line-height:1.55">${esc(S.b.name)}: "${esc(sb)}"</p>`:""}
      </div></div>`:""}
      <div class="card bloom" style="text-align:left"><div class="stack sm">
        ${r.pact.map((p,i)=>`<div style="display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start">
          <span class="pactnum" style="font-size:15px">${i+1}</span><span style="font-size:14px;line-height:1.5">${esc(p)}</span></div>`).join("")}
      </div></div>
      <p class="tiny">Settled in ${S.round} round${S.round>1?"s":""}</p>
    </div>
    <div class="stack" style="padding-top:10px">
      <button class="btn ghost" id="saveTxt">Save the summary</button>
      <button class="btn bloom" id="again">Start a new mediation</button></div>`);
  $("#again",n).onclick=reset;
  $("#saveTxt",n).onclick=saveSummary;
  return n;
}

function summaryText(){
  const r=S.report,A=S.a.name,B=S.b.name,L=[];
  L.push("OBVIOUSLY, I'M RIGHT — mediation summary");
  L.push(`${A} and ${B} · ${S.relation} · about ${S.topic} · round ${S.round}`);
  L.push("".padEnd(52,"-"),"",r.headline,"");
  L.push("WHAT YOU AGREE ON"); r.commonGround.forEach(x=>L.push("  · "+x)); L.push("");
  L.push("WHERE YOUR STORIES SPLIT");
  r.truthMap.forEach(x=>{L.push(`  [${x.kind}] ${x.what}`);L.push(`      ${A}: ${x.a}`);L.push(`      ${B}: ${x.b}`);});
  L.push("","WHAT YOU EACH MEANT",`  ${A}: ${r.bridge.a.meant}`,`  ${B}: ${r.bridge.b.meant}`);
  L.push("","WHAT WENT UNSAID",`  ${A}: ${r.unsaid.a}`,`  ${B}: ${r.unsaid.b}`);
  L.push("","THE AGREEMENT"); r.pact.forEach((p,i)=>L.push(`  ${i+1}. ${p}`));
  L.push("","FIRST WORDS",`  ${A}: "${r.apology.a}"`,`  ${B}: "${r.apology.b}"`);
  const sa=S.flip.a.statement||S.flip.a.script?.resolution?.statement||"";
  const sb=S.flip.b.statement||S.flip.b.script?.resolution?.statement||"";
  if(sa||sb){ L.push("",""+T("flip").toUpperCase());
    if(sa) L.push(`  ${A}: "${sa}"`);
    if(sb) L.push(`  ${B}: "${sb}"`); }
  L.push("",r.closing);
  return L.join("\n");
}
async function saveSummary(){
  const txt=summaryText();
  const name=`mediation-${S.a.name}-${S.b.name}.txt`.replace(/\s+/g,"-").toLowerCase();
  if(window.claude?.use){ try{ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename:name,data:txt}); return; } }catch(e){} }
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ navigator.share?.({title:"Mediation summary",text:txt}).catch(()=>{}); }
}

/* ---------------------------------------------------------------
   23. SETTINGS
   --------------------------------------------------------------- */
let deferredInstall=null;
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredInstall=e; });

function openSettings(){
  const sheet=$("#sheet"), body=$("#sheetbody");
  body.innerHTML=`<div class="grip"></div><div class="stack lg">
    <div><h3 class="h3">Settings</h3>
      <p class="lede" style="margin-top:7px">Mediator: <b>${esc(AI.label())}</b> · Sync: <b>${esc(Net.label())}</b></p></div>
    ${AI.hasConfig?`<div class="notice" style="padding:11px 13px">This app is configured by its host — provider, keys, safe-saving and two-device sync are all set for everyone. Nothing to add here.</div>`
      :(AI.serverUrl?`<div class="notice" style="padding:11px 13px">Cloud proxy is live — provider keys live in Netlify's environment variables, not in this browser.</div>`:"")}
    <div id="manualCfg" ${AI.hasConfig?"hidden":""}>
      <div class="field"><span>Cloud proxy URL (optional)</span>
        <input class="input" id="proxyIn" placeholder="https://your-site.netlify.app/.netlify/functions/ai">
        <p class="tiny">Leave empty to use this site's own proxy. Set it on a copy hosted elsewhere (e.g. the Firebase dashboard) so it reuses Netlify's keys.</p></div>
      <div class="field"><span>AI provider</span>
        <select class="input" id="provIn">
          <option value="groq">Groq</option>
          <option value="openai">OpenAI · GPT-6 Astra</option>
          <option value="gemini">Google Gemini</option>
        </select>
        <p class="tiny" id="provTip"></p></div>
      <div class="field"><span>API key</span>
        <input class="input" id="keyIn" type="password" placeholder="Paste the provider's API key here">
        <p class="tiny">Stored in this browser only. Each provider keeps its own key.</p></div>
      <div class="field"><span>Firebase Realtime Database URL</span>
        <input class="input" id="fbIn" placeholder="https://your-project-default-rtdb.firebaseio.com" value="${esc(store.get("fb","")||"")}">
        <p class="tiny">Turns on two-device rooms when hosted. Set the database rules to public read/write for the demo.</p></div>
    </div>
    <div id="managedCfg" ${AI.hasConfig?"":"hidden"}>
      <div class="field"><span>Cloud proxy URL</span>
        <input class="input" id="managedProxy" value="${esc(AI.configUrl?AI.configUrl.replace(/\/config$/,"/ai"):"")}" readonly>
        <p class="tiny">Managed by the host.</p></div>
      <div class="field"><span>AI provider</span>
        <input class="input" id="managedProv" value="${esc(AI.cfg&&AI.cfg.provider?"Connected · "+AI.cfg.provider:"")}" readonly>
        <p class="tiny">Managed by the host. The mediator falls back across all providers automatically.</p></div>
      <div class="field"><span>Two-device sync</span>
        <input class="input" id="managedFb" value="${esc((AI.cfg&&AI.cfg.firebaseUrl)?"On ("+AI.cfg.firebaseUrl+")":"Off")}" readonly>
        <p class="tiny">Managed by the host.</p></div>
    </div>
    <div class="field"><span>Language &amp; voice</span>
      <select class="input" id="langIn">
        <option value="auto">Auto (follow this browser)</option>
        <option value="en-US">English — US</option>
        <option value="en-GB">English — UK</option>
        <option value="en-AU">English — Australia</option>
        <option value="en-NZ">English — New Zealand</option>
        <option value="en-CA">English — Canada</option>
        <option value="en-IN">English — India</option>
        <option value="ml-IN">മലയാളം — Malayalam</option>
        <option value="hi-IN">हिन्दी — Hindi</option>
      </select>
      <p class="tiny">Used to recognise your voice, pick the mediator's voice, and reply in the same language. Selecting Malayalam or Hindi forces replies in that language; in auto mode, the mediator detects it from what you type. Malayalam and Hindi replies are spoken with a cloud voice when the app is hosted, so no device voice is needed. ${AI.cfg&&AI.cfg.accent?`Site default: <b>${esc(AI.cfg.accent)}</b> — your choice here overrides it just for you.`:""}</p>
      <div class="notice warn" id="voiceTip" hidden></div></div>
    <button class="btn ghost" id="saveCfg">Save and reload</button>
    <button class="btn ghost" id="testBtn">Test the connection</button>
    <div class="notice" id="testOut" hidden></div>
    ${deferredInstall?`<button class="btn ghost" id="install">Install on this phone</button>`:
      `<p class="notice">To install: browser menu, then "Add to Home screen".</p>`}
    <button class="btn ghost" id="hostBtn">Host settings (owner)</button>
    <button class="btn ghost" id="wipe">Clear this mediation</button>
    <button class="linkish" id="close" style="text-align:center">Close</button></div>`;
  sheet.classList.add("on");
  const close=()=>sheet.classList.remove("on");
  const provSel=$("#provIn",body), keyIn=$("#keyIn",body), keyTip=$("#provTip",body);
  const langIn=$("#langIn",body);
  langIn.value=store.get("lang", null)||store.get("accent", null)||"auto";
  langIn.onchange=()=>{
    const v=langIn.value;
    store.set("lang", v); store.del("accent");
    AI.lang=v;
    Speak.pick();
    const voiceTip=$("#voiceTip",body);
    const onHost = !!(globalThis.AI && AI.serverUrl);
    const cloudOk = /^(ml|hi)/i.test(v) && onHost;
    if(/^(ml|hi)/i.test(v) && !onHost){
      voiceTip.hidden=false;
      voiceTip.textContent="Voice replies need the hosted site. Open https://oirai.netlify.app in this browser (this local file can't reach the cloud voice).";
    } else { voiceTip.hidden=true; }
    if(Speak.enabled && (cloudOk || Speak.ready())){
      const sample = /^ml/i.test(v) ? "എനിക്ക് മലയാളത്തിൽ ചിന്തിക്കാനും പറയാനും കഴിയും."
        : /^hi/i.test(v) ? "मैं हिंदी में सोच और बोल सकती हूँ।"
        : "I can listen and reply in this language.";
      Speak.cancel(); Speak.reset(); Speak.flush(sample, ()=>{});
    }
  };
  const proxyIn=$("#proxyIn",body);
  proxyIn.value = AI.proxyBase && !AI.proxyBase.startsWith("/") ? AI.proxyBase : "";
  const keys={groq:AI.keys.groq, openai:AI.keys.openai, gemini:AI.keys.gemini};
  const provTips={
    groq:"Groq is the fastest — paste your key above.",
    openai:"GPT-6 Astra, OpenAI's flagship model — paste your key above.",
    gemini:"Gemini needs the Generative Language API enabled on its Google project."
  };
  provSel.value=AI.provider;
  provSel.dataset.prev=AI.provider;
  keyIn.value=keys[provSel.value]||"";
  keyTip.textContent=provTips[provSel.value];
  provSel.onchange=()=>{
    keys[provSel.dataset.prev]=keyIn.value.trim();
    keyIn.value=keys[provSel.value]||"";
    provSel.dataset.prev=provSel.value;
    keyTip.textContent=provTips[provSel.value];
  };
  $("#close",body).onclick=close;
  sheet.onclick=e=>{ if(e.target===sheet) close(); };
  $("#saveCfg",body).onclick=()=>{
    store.set("lang", langIn.value.trim()||"auto"); store.del("accent");
    if(!AI.hasConfig){
      const p=provSel.value, k=keyIn.value.trim(), f=$("#fbIn",body).value.trim().replace(/\/+$/,"");
      const pr=proxyIn.value.trim().replace(/\/+$/,"");
      keys[p]=k;
      store.set("provider",p);
      keys.groq?store.set("key_groq",keys.groq):store.del("key_groq");
      keys.openai?store.set("key_openai",keys.openai):store.del("key_openai");
      keys.gemini?store.set("key_gemini",keys.gemini):store.del("key_gemini");
      store.del("key");
      pr?store.set("proxy",pr):store.del("proxy");
      f?store.set("fb",f):store.del("fb");
    }
    try{ location.reload(); }catch(e){ close(); render(); }
  };
  $("#testBtn",body).onclick=async()=>{
    const out=$("#testOut",body), btn=$("#testBtn",body);
    out.hidden=false; out.className="notice"; out.textContent="Calling the mediator…";
    btn.disabled=true;
    if(!AI.hasConfig && provSel){
      const p=provSel.value, k=keyIn.value.trim();
      if(k && k!==AI.keys[p]){ AI.keys[p]=k; store.set("key_"+p,k); }
      AI.provider=p; store.set("provider",p);
    }
    await AI.init();
    const r=await AI.test();
    btn.disabled=false;
    out.className = "notice"+(r.ok?"":" warn");
    out.innerHTML = r.ok
      ? `<b style="color:var(--bloom)">Live.</b> ${esc(r.backend)} answered in ${r.ms}ms — "${esc(r.detail)}". Real replies from here on.`
      : `<b style="color:var(--ember)">Not connected.</b> ${esc(r.backend)} said: ${esc(r.detail)}<br><br>Most common causes: the API key isn't enabled on that provider's project, the key has an HTTP-referrer restriction that blocks this site, or the key was pasted with a stray space.`;
  };
  $("#hostBtn",body).onclick=()=>{ close(); go("admin"); };
  const ins=$("#install",body); if(ins) ins.onclick=()=>{ close(); deferredInstall.prompt(); deferredInstall=null; };
  $("#wipe",body).onclick=()=>{ close(); reset(); };
}

function wipeSession(msg){
  if(!confirm(msg)) return false;
  TOKEN++; Speak.cancel(); Ears.stop(false); Net.stopListen();
  if(S.room && Net.available()) Net.destroy();
  store.del("last");
  Object.assign(S,{stage:"open",room:null,seat:null,mode:"solo",a:blankSide(),b:blankSide(),
    relation:"",topic:"",report:null,cross:null,round:1,signed:{a:false,b:false},briefA:null});
  Sky.setMerge(0); Sky.setFocus(0);
  render();
  return true;
}
function reset(){ wipeSession("Empty this mediation for good? Everyone returns to the opening screen."); }
function endMediation(){ wipeSession("End this mediation? Both sides' rooms are wiped and everyone returns to the opening screen."); }

/* ---------------------------------------------------------------
   24. BOOT
   --------------------------------------------------------------- */
(async function boot(){
  render();
  await AI.init();            // also fetches the host config the owner set
  await Net.init();
  const bootRoom = new URLSearchParams(location.search).get("room") || "";
  const prev = store.get("last", null);
  if(prev && prev.stage && prev.stage!=="open" && prev.a?.name){
    Object.assign(S, prev);
    if(S.room && Net.available()) Net.listen();
  }
  if(bootRoom && S.room!==bootRoom){      // a fresh link means: someone else opened a room for you
    Net.stopListen();
    S.mode="pair"; S.stage="pair"; S.room=bootRoom; S.seat=null;
    render();
  }
  addEventListener("beforeunload",()=>{ try{ Speak.cancel(); }catch(e){} });
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ Speak.cancel(); Ears.stop(false); } });
})();
</script>
